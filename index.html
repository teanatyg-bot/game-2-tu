<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYBER SURVIVOR - REALISTIC EDITION</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: #05050a;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        #game-container {
            position: relative;
            width: 960px;
            height: 540px;
            box-shadow: 0 0 50px rgba(0, 240, 255, 0.3), inset 0 0 20px rgba(0, 0, 0, 0.8);
            border: 2px solid rgba(0, 240, 255, 0.5);
            border-radius: 12px;
            overflow: hidden;
            background: #000;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* UI Overlays */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(5, 5, 12, 0.75);
            backdrop-filter: blur(8px);
            z-index: 10;
            transition: opacity 0.3s ease;
        }

        .hidden {
            display: none !important;
        }

        /* 激しいエフェクト付き巨大タイトルロゴ */
        .title-logo-wrapper {
            position: relative;
            margin-bottom: 25px;
            text-align: center;
        }

        .title-logo {
            font-size: 68px;
            font-weight: 900;
            font-style: italic;
            letter-spacing: 6px;
            color: #fff;
            text-transform: uppercase;
            text-shadow: 
                0 0 10px #00f0ff,
                0 0 20px #00f0ff,
                0 0 40px #00f0ff,
                0 0 80px #ff0055,
                0 0 120px #ff0055;
            animation: logoPulse 1.2s infinite alternate, glitch 2.5s infinite;
            transform: scale(1.1);
        }

        .title-sub {
            font-size: 18px;
            letter-spacing: 12px;
            color: #ff0055;
            text-shadow: 0 0 10px #ff0055;
            margin-top: -10px;
            font-weight: bold;
        }

        @keyframes logoPulse {
            0% {
                transform: scale(1) skewX(-5deg);
                filter: brightness(1) drop-shadow(0 0 15px rgba(0,240,255,0.8));
            }
            100% {
                transform: scale(1.08) skewX(-5deg);
                filter: brightness(1.4) drop-shadow(0 0 35px rgba(255,0,85,1));
            }
        }

        @keyframes glitch {
            0%, 90%, 100% { transform: translate(0, 0) skewX(-5deg); }
            92% { transform: translate(-3px, 2px) skewX(-2deg); }
            94% { transform: translate(3px, -2px) skewX(-8deg); }
            96% { transform: translate(-2px, -1px) skewX(-5deg); }
        }

        .btn {
            background: linear-gradient(135deg, #00f0ff, #ff0055);
            border: none;
            color: #fff;
            padding: 14px 40px;
            font-size: 22px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.6);
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .btn:hover {
            transform: scale(1.08);
            box-shadow: 0 0 35px rgba(255, 0, 85, 0.9);
        }

        /* HUD */
        #hud {
            position: absolute;
            top: 15px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: none;
            z-index: 5;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            font-size: 20px;
            text-shadow: 0 0 8px rgba(0, 240, 255, 0.8);
        }

        .hud-item {
            background: rgba(0, 0, 0, 0.5);
            padding: 6px 16px;
            border-radius: 20px;
            border: 1px solid rgba(0, 240, 255, 0.3);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .life-heart {
            color: #ff0055;
            font-size: 22px;
            filter: drop-shadow(0 0 5px #ff0055);
            transition: transform 0.2s;
        }

        .life-critical {
            animation: heartBeat 0.5s infinite alternate;
        }

        @keyframes heartBeat {
            0% { transform: scale(1); filter: drop-shadow(0 0 5px #ff0055); }
            100% { transform: scale(1.3); filter: drop-shadow(0 0 15px #ff0055); }
        }

        /* Critical Warning Overlay */
        #critical-warning {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            box-shadow: inset 0 0 60px rgba(255, 0, 0, 0.6);
            animation: warningPulse 0.8s infinite alternate;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 4;
        }

        @keyframes warningPulse {
            0% { opacity: 0.2; }
            100% { opacity: 0.8; }
        }

        .score-board {
            text-align: center;
            margin-bottom: 20px;
        }

        .score-val {
            font-size: 42px;
            color: #00f0ff;
            text-shadow: 0 0 15px #00f0ff;
            font-weight: bold;
        }

        .highscore-val {
            font-size: 20px;
            color: #ffcc00;
            text-shadow: 0 0 10px #ffcc00;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas" width="960" height="540"></canvas>
        <div id="critical-warning"></div>

        <!-- HUD -->
        <div id="hud">
            <div class="hud-item">
                <span>LIFE:</span>
                <span id="lives-display"></span>
            </div>
            <div class="hud-item">
                <span>SCORE: <span id="score-display">0</span></span>
            </div>
            <div class="hud-item">
                <span style="color: #ffcc00;">BEST: <span id="highscore-display">0</span></span>
            </div>
        </div>

        <!-- START SCREEN -->
        <div id="start-screen" class="overlay">
            <div class="title-logo-wrapper">
                <div class="title-logo">CYBER SURVIVOR</div>
                <div class="title-sub">REALISTIC OVERDRIVE</div>
            </div>
            <div class="score-board">
                <div class="highscore-val">HIGH SCORE: <span id="start-highscore">0</span></div>
            </div>
            <button id="start-btn" class="btn">GAME START</button>
        </div>

        <!-- GAME OVER SCREEN -->
        <div id="gameover-screen" class="overlay hidden">
            <h1 style="font-size: 50px; color: #ff0055; text-shadow: 0 0 20px #ff0055; margin-bottom: 10px;">GAME OVER</h1>
            <div class="score-board">
                <div style="font-size: 18px; color: #aaa;">FINAL SCORE</div>
                <div id="final-score" class="score-val">0</div>
                <div id="final-highscore" class="highscore-val">HIGH SCORE: 0</div>
            </div>
            <button id="restart-btn" class="btn">TRY AGAIN</button>
        </div>
    </div>

    <script>
        // ==========================================
        // ユーザー指定用サウンド設定
        // ==========================================
        // 私指定の効果音（音声ファイルのURL）がある場合は、下記のダブルクォーテーション内にURLを記載してください。
        // 未指定（空文字）の場合は、内蔵Web Audio APIによるリアルな被弾重低音サウンドが再生されます。
        const CUSTOM_DAMAGE_SOUND_URL = ""; 

        // Sound System (Web Audio API)
        class SoundSystem {
            constructor() {
                this.ctx = null;
                this.bgmNode = null;
                this.bgmGain = null;
                this.bgmInterval = null;
                this.bgmSpeed = 1.0;
                this.customDamageAudio = null;

                if (CUSTOM_DAMAGE_SOUND_URL !== "") {
                    this.customDamageAudio = new Audio(CUSTOM_DAMAGE_SOUND_URL);
                }
            }

            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            // BGM (シンセサイザービート生成)
            startBGM() {
                this.stopBGM();
                this.init();
                
                let step = 0;
                const notes = [110, 110, 130, 110, 146, 110, 130, 120]; // サスペンスビートベース音
                
                const playStep = () => {
                    if (!this.ctx) return;
                    
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    
                    osc.type = 'sawtooth';
                    const freq = notes[step % notes.length] * (this.bgmSpeed > 1.1 ? 1.25 : 1.0);
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                    
                    // フィルターで重低音強調
                    const filter = this.ctx.createBiquadFilter();
                    filter.type = 'lowpass';
                    filter.frequency.setValueAtTime(this.bgmSpeed > 1.1 ? 1200 : 600, this.ctx.currentTime);

                    gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + (0.2 / this.bgmSpeed));

                    osc.connect(filter);
                    filter.connect(gain);
                    gain.connect(this.ctx.destination);

                    osc.start();
                    osc.stop(this.ctx.currentTime + (0.2 / this.bgmSpeed));

                    step++;
                };

                const intervalMs = () => 220 / this.bgmSpeed;
                
                const loop = () => {
                    playStep();
                    this.bgmInterval = setTimeout(loop, intervalMs());
                };
                
                loop();
            }

            setBGMSpeed(speed) {
                this.bgmSpeed = speed; // ライフ1で1.2倍に変更
            }

            stopBGM() {
                if (this.bgmInterval) {
                    clearTimeout(this.bgmInterval);
                    this.bgmInterval = null;
                }
            }

            // ライフ減少効果音（私指定サウンド対応）
            playDamageSound() {
                if (this.customDamageAudio) {
                    this.customDamageAudio.currentTime = 0;
                    this.customDamageAudio.play().catch(e => console.log("Audio play error:", e));
                    return;
                }

                // 内蔵ダイナミック重爆発音
                this.init();
                const ctx = this.ctx;
                const now = ctx.currentTime;

                // ノイズ
                const bufferSize = ctx.sampleRate * 0.5;
                const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
                const output = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    output[i] = Math.random() * 2 - 1;
                }

                const whiteNoise = ctx.createBufferSource();
                whiteNoise.buffer = buffer;

                const filter = ctx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(800, now);
                filter.frequency.exponentialRampToValueAtTime(30, now + 0.5);

                const gain = ctx.createGain();
                gain.gain.setValueAtTime(0.6, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);

                whiteNoise.connect(filter);
                filter.connect(gain);
                gain.connect(ctx.destination);

                whiteNoise.start(now);
            }

            // 200点ごとのレベルアップ・難易度上昇効果音
            playLevelUpSound() {
                this.init();
                const ctx = this.ctx;
                const now = ctx.currentTime;

                const freqs = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
                freqs.forEach((f, i) => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(f, now + i * 0.08);

                    gain.gain.setValueAtTime(0.2, now + i * 0.08);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.08 + 0.15);

                    osc.connect(gain);
                    gain.connect(ctx.destination);

                    osc.start(now + i * 0.08);
                    osc.stop(now + i * 0.08 + 0.15);
                });
            }
        }

        const sound = new SoundSystem();

        // Canvas Setup
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // UI Elements
        const livesDisplay = document.getElementById('lives-display');
        const scoreDisplay = document.getElementById('score-display');
        const highscoreDisplay = document.getElementById('highscore-display');
        const startHighscore = document.getElementById('start-highscore');
        const finalHighscore = document.getElementById('final-highscore');
        const criticalWarning = document.getElementById('critical-warning');
        const startScreen = document.getElementById('start-screen');
        const gameoverScreen = document.getElementById('gameover-screen');
        const finalScore = document.getElementById('final-score');

        // Game State
        let gameRunning = false;
        let score = 0;
        let highScore = localStorage.getItem('cyber_survivor_highscore') || 0;
        let lives = 3;
        let lastLevelUpScore = 0;
        let speedMultiplier = 1.0;
        let spawnInterval = 90; // frames
        let frameCount = 0;

        // Key Input
        const keys = { ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false, w: false, s: false, a: false, d: false };
        window.addEventListener('keydown', e => { if (keys.hasOwnProperty(e.key)) keys[e.key] = true; });
        window.addEventListener('keyup', e => { if (keys.hasOwnProperty(e.key)) keys[e.key] = false; });

        // Update High Score UI
        function updateHighScoreUI() {
            highscoreDisplay.textContent = highScore;
            startHighscore.textContent = highScore;
            finalHighscore.textContent = "HIGH SCORE: " + highScore;
        }
        updateHighScoreUI();

        // Player (Cyber Ship)
        class Player {
            constructor() {
                this.width = 50;
                this.height = 30;
                this.x = 80;
                this.y = canvas.height / 2;
                this.speed = 6;
                this.engineParticles = [];
            }

            update() {
                if (keys.ArrowUp || keys.w) this.y -= this.speed;
                if (keys.ArrowDown || keys.s) this.y += this.speed;
                if (keys.ArrowLeft || keys.a) this.x -= this.speed;
                if (keys.ArrowRight || keys.d) this.x += this.speed;

                // Boundaries
                this.x = Math.max(10, Math.min(canvas.width - this.width - 10, this.x));
                this.y = Math.max(10, Math.min(canvas.height - this.height - 10, this.y));

                // Engine Particles
                this.engineParticles.push({
                    x: this.x - 5,
                    y: this.y + this.height / 2 + (Math.random() * 8 - 4),
                    vx: -(Math.random() * 4 + 4),
                    vy: Math.random() * 2 - 1,
                    size: Math.random() * 6 + 3,
                    life: 1.0,
                    color: Math.random() > 0.3 ? '#00f0ff' : '#ff0055'
                });

                this.engineParticles.forEach((p, i) => {
                    p.x += p.vx;
                    p.y += p.vy;
                    p.life -= 0.05;
                    p.size *= 0.95;
                    if (p.life <= 0) this.engineParticles.splice(i, 1);
                });
            }

            draw() {
                // Draw Jet Flame
                this.engineParticles.forEach(p => {
                    ctx.save();
                    ctx.globalAlpha = p.life;
                    ctx.fillStyle = p.color;
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = p.color;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                });

                // Draw Realistic Metallic Spacecraft
                ctx.save();
                ctx.translate(this.x, this.y);

                // Body Gradient
                const grad = ctx.createLinearGradient(0, 0, this.width, this.height);
                grad.addColorStop(0, '#1e293b');
                grad.addColorStop(0.5, '#475569');
                grad.addColorStop(1, '#0f172a');

                // Main Wing/Hull
                ctx.fillStyle = grad;
                ctx.strokeStyle = '#00f0ff';
                ctx.lineWidth = 1.5;
                ctx.shadowBlur = 12;
                ctx.shadowColor = '#00f0ff';

                ctx.beginPath();
                ctx.moveTo(this.width, this.height / 2); // Nose
                ctx.lineTo(10, 0); // Upper Wing
                ctx.lineTo(0, 8); // Back Top
                ctx.lineTo(8, this.height / 2); // Engine center
                ctx.lineTo(0, this.height - 8); // Back Bottom
                ctx.lineTo(10, this.height); // Lower Wing
                ctx.closePath();
                ctx.fill();
                ctx.stroke();

                // Cockpit Glass
                const glassGrad = ctx.createLinearGradient(15, 5, 35, 15);
                glassGrad.addColorStop(0, 'rgba(0, 240, 255, 0.9)');
                glassGrad.addColorStop(1, 'rgba(0, 50, 100, 0.4)');
                ctx.fillStyle = glassGrad;
                ctx.beginPath();
                ctx.ellipse(this.width * 0.6, this.height / 2, 12, 5, 0, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
            }
        }

        // 超リアル背景 (多層パララックス + 星雲 + 輝く星々)
        class RealisticBackground {
            constructor() {
                this.starsFar = [];
                this.starsNear = [];
                this.nebulas = [];

                // Far Stars
                for (let i = 0; i < 120; i++) {
                    this.starsFar.push({
                        x: Math.random() * canvas.width,
                        y: Math.random() * canvas.height,
                        size: Math.random() * 1.5 + 0.5,
                        speed: Math.random() * 0.5 + 0.2,
                        alpha: Math.random()
                    });
                }

                // Near Bright Stars
                for (let i = 0; i < 40; i++) {
                    this.starsNear.push({
                        x: Math.random() * canvas.width,
                        y: Math.random() * canvas.height,
                        size: Math.random() * 2.5 + 1.5,
                        speed: Math.random() * 2 + 1,
                        color: ['#00f0ff', '#ffffff', '#ff0055', '#ffcc00'][Math.floor(Math.random() * 4)]
                    });
                }

                // Nebulas
                for (let i = 0; i < 3; i++) {
                    this.nebulas.push({
                        x: Math.random() * canvas.width,
                        y: Math.random() * canvas.height,
                        radius: Math.random() * 200 + 150,
                        color: i % 2 === 0 ? 'rgba(76, 29, 149, 0.15)' : 'rgba(14, 116, 144, 0.15)'
                    });
                }
            }

            update() {
                this.starsFar.forEach(s => {
                    s.x -= s.speed * speedMultiplier;
                    if (s.x < 0) s.x = canvas.width;
                });

                this.starsNear.forEach(s => {
                    s.x -= s.speed * speedMultiplier;
                    if (s.x < 0) s.x = canvas.width;
                });

                this.nebulas.forEach(n => {
                    n.x -= 0.3 * speedMultiplier;
                    if (n.x < -n.radius * 2) n.x = canvas.width + n.radius;
                });
            }

            draw() {
                // Background Gradient Base
                const bgGrad = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
                bgGrad.addColorStop(0, '#030308');
                bgGrad.addColorStop(0.5, '#070a14');
                bgGrad.addColorStop(1, '#020205');
                ctx.fillStyle = bgGrad;
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // Nebulas (Volumetric Glow)
                this.nebulas.forEach(n => {
                    ctx.save();
                    const g = ctx.createRadialGradient(n.x, n.y, 10, n.x, n.y, n.radius);
                    g.addColorStop(0, n.color);
                    g.addColorStop(1, 'transparent');
                    ctx.fillStyle = g;
                    ctx.beginPath();
                    ctx.arc(n.x, n.y, n.radius, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                });

                // Far Stars
                ctx.fillStyle = '#ffffff';
                this.starsFar.forEach(s => {
                    ctx.globalAlpha = Math.abs(Math.sin(Date.now() * 0.002 + s.alpha * 10));
                    ctx.fillRect(s.x, s.y, s.size, s.size);
                });
                ctx.globalAlpha = 1.0;

                // Near Bright Stars with Glow
                this.starsNear.forEach(s => {
                    ctx.save();
                    ctx.shadowBlur = 8;
                    ctx.shadowColor = s.color;
                    ctx.fillStyle = s.color;
                    ctx.beginPath();
                    ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                });
            }
        }

        // 超リアル障害物 (シェーディング小惑星 & 発光プラズマコア)
        class Obstacle {
            constructor() {
                this.type = Math.random() > 0.3 ? 'asteroid' : 'plasma';
                this.radius = Math.random() * 20 + 20; // Size
                this.x = canvas.width + this.radius + 20;
                this.y = Math.random() * (canvas.height - this.radius * 2) + this.radius;
                this.speed = (Math.random() * 3 + 3) * speedMultiplier;
                this.rotation = 0;
                this.rotSpeed = (Math.random() - 0.5) * 0.05;

                // Asteroid Vertices for Realistic Irregular Shape
                this.vertices = [];
                const numVerts = Math.floor(Math.random() * 5) + 7;
                for (let i = 0; i < numVerts; i++) {
                    const angle = (i / numVerts) * Math.PI * 2;
                    const dist = this.radius * (0.75 + Math.random() * 0.5);
                    this.vertices.push({ x: Math.cos(angle) * dist, y: Math.sin(angle) * dist });
                }
            }

            update() {
                this.x -= this.speed;
                this.rotation += this.rotSpeed;
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);

                if (this.type === 'asteroid') {
                    // 3D Metallic/Stone Shaded Asteroid
                    const grad = ctx.createRadialGradient(
                        -this.radius * 0.3, -this.radius * 0.3, 2,
                        0, 0, this.radius * 1.2
                    );
                    grad.addColorStop(0, '#8d99ae');
                    grad.addColorStop(0.5, '#4a5568');
                    grad.addColorStop(1, '#1a202c');

                    ctx.fillStyle = grad;
                    ctx.strokeStyle = '#2d3748';
                    ctx.lineWidth = 2;

                    ctx.beginPath();
                    ctx.moveTo(this.vertices[0].x, this.vertices[0].y);
                    for (let i = 1; i < this.vertices.length; i++) {
                        ctx.lineTo(this.vertices[i].x, this.vertices[i].y);
                    }
                    ctx.closePath();
                    ctx.fill();
                    ctx.stroke();

                    // Craters / Texture
                    ctx.fillStyle = 'rgba(0, 0, 0, 0.35)';
                    ctx.beginPath();
                    ctx.arc(-this.radius * 0.2, -this.radius * 0.1, this.radius * 0.25, 0, Math.PI * 2);
                    ctx.arc(this.radius * 0.3, this.radius * 0.2, this.radius * 0.2, 0, Math.PI * 2);
                    ctx.fill();

                } else {
                    // High Energy Glowing Plasma Core
                    ctx.shadowBlur = 20;
                    ctx.shadowColor = '#ff0055';

                    const pGrad = ctx.createRadialGradient(0, 0, 0, 0, 0, this.radius);
                    pGrad.addColorStop(0, '#ffffff');
                    pGrad.addColorStop(0.3, '#ff0055');
                    pGrad.addColorStop(0.8, '#990033');
                    pGrad.addColorStop(1, 'transparent');

                    ctx.fillStyle = pGrad;
                    ctx.beginPath();
                    ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
                    ctx.fill();
                }

                ctx.restore();
            }

            getBounds() {
                return { x: this.x, y: this.y, radius: this.radius * 0.85 };
            }
        }

        // Instances
        const player = new Player();
        const background = new RealisticBackground();
        let obstacles = [];

        // UI Hearts Renderer
        function renderLivesUI() {
            livesDisplay.innerHTML = '';
            for (let i = 0; i < 3; i++) {
                const heart = document.createElement('span');
                heart.className = 'life-heart' + (lives === 1 ? ' life-critical' : '');
                heart.textContent = i < lives ? '♥' : '♡';
                if (i >= lives) heart.style.color = '#444';
                livesDisplay.appendChild(heart);
            }

            // ライフ1のBGMテンポ1.2倍 ＆ 危険フラッシュ
            if (lives === 1) {
                sound.setBGMSpeed(1.2);
                criticalWarning.style.opacity = '1';
            } else {
                sound.setBGMSpeed(1.0);
                criticalWarning.style.opacity = '0';
            }
        }

        // Start Game
        function startGame() {
            sound.init();
            sound.setBGMSpeed(1.0);
            sound.startBGM();

            lives = 3;
            score = 0;
            lastLevelUpScore = 0;
            speedMultiplier = 1.0;
            spawnInterval = 80;
            obstacles = [];
            player.x = 80;
            player.y = canvas.height / 2;

            scoreDisplay.textContent = score;
            renderLivesUI();

            startScreen.classList.add('hidden');
            gameoverScreen.classList.add('hidden');
            gameRunning = true;
        }

        // Game Over
        function gameOver() {
            gameRunning = false;
            sound.stopBGM();

            if (score > highScore) {
                highScore = score;
                localStorage.setItem('cyber_survivor_highscore', highScore);
                updateHighScoreUI();
            }

            finalScore.textContent = score;
            criticalWarning.style.opacity = '0';
            gameoverScreen.classList.remove('hidden');
        }

        // Collision Check (Circle vs Rounded Box)
        function checkCollision(p, obs) {
            const b = obs.getBounds();
            const closestX = Math.max(p.x, Math.min(b.x, p.x + p.width));
            const closestY = Math.max(p.y, Math.min(b.y, p.y + p.height));

            const distX = b.x - closestX;
            const distY = b.y - closestY;

            return (distX * distX + distY * distY) < (b.radius * b.radius);
        }

        // Game Loop
        function gameLoop() {
            requestAnimationFrame(gameLoop);

            background.update();
            background.draw();

            if (!gameRunning) return;

            frameCount++;
            score++;
            scoreDisplay.textContent = score;

            // 200点ごとの難易度向上 ＆ レベルアップ効果音
            if (score - lastLevelUpScore >= 200) {
                lastLevelUpScore = Math.floor(score / 200) * 200;
                speedMultiplier += 0.15;
                spawnInterval = Math.max(30, spawnInterval - 6);
                sound.playLevelUpSound();
            }

            // Player Update
            player.update();
            player.draw();

            // Spawn Obstacles
            if (frameCount % Math.floor(spawnInterval) === 0) {
                obstacles.push(new Obstacle());
            }

            // Obstacles Loop
            for (let i = obstacles.length - 1; i >= 0; i--) {
                const obs = obstacles[i];
                obs.update();
                obs.draw();

                // Collision Detection
                if (checkCollision(player, obs)) {
                    sound.playDamageSound(); // 被弾効果音再生
                    lives--;
                    renderLivesUI();

                    // Explosive particles visually
                    obstacles.splice(i, 1);

                    if (lives <= 0) {
                        gameOver();
                        break;
                    }
                } else if (obs.x < -obs.radius * 2) {
                    obstacles.splice(i, 1);
                }
            }
        }

        // Event Listeners
        document.getElementById('start-btn').addEventListener('click', startGame);
        document.getElementById('restart-btn').addEventListener('click', startGame);

        // Run Animation Engine
        gameLoop();
