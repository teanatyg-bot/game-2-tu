<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">

  <title>SUPER RUNNER</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=M+PLUS+Rounded+1c:wght@800;900&family=Orbitron:wght@900&display=swap');

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100svh;
      overflow: hidden;
      background-color: #000000;
      font-family: 'M PLUS Rounded 1c', 'Fredoka One', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #game-container {
      position: relative;
      width: 100vw;
      height: 100svh;
      max-width: 177.78svh;
      max-height: 56.25vw;
      background: #000;
      overflow: hidden;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .ui-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 12px 20px;
      z-index: 10;
    }

    .header-ui {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
    }

    .left-ui {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .lives-container {
      display: flex;
      gap: 4px;
      font-size: 24px;
      filter: drop-shadow(0 0 6px rgba(255, 0, 85, 0.8));
    }

    .score-board {
      display: flex;
      gap: 15px;
      font-size: 18px;
      font-weight: 900;
      text-shadow: 2px 2px 0 #000, -2px -2px 0 #000;
    }

    .score-board .current-score { color: #fde047; }
    .score-board .high-score { color: #4ade80; }

    .level-badge {
      font-size: 18px;
      font-weight: 900;
      color: #ffffff;
      background: rgba(15, 23, 42, 0.85);
      padding: 4px 16px;
      border-radius: 20px;
      border: 2px solid #38bdf8;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
      text-shadow: 1px 1px 2px #000;
    }

    .btn-pause {
      pointer-events: auto;
      background: #f59e0b;
      border: 2px solid #ffffff;
      color: #ffffff;
      font-weight: 900;
      font-family: 'Fredoka One', sans-serif;
      padding: 6px 16px;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 3px 0 #b45309;
      font-size: 16px;
    }

    .btn-pause:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #b45309;
    }

    .overlay-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url('bg_title.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: auto;
      z-index: 20;
      overflow: hidden;
    }

    .overlay-screen.hidden {
      display: none !important;
    }

    .overlay-screen::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(2px);
      z-index: 1;
    }

    /* --- タイトルロゴ＆強烈なエフェクト --- */
    .logo-container {
      position: relative;
      z-index: 2;
      margin-bottom: 15px;
      text-align: center;
      max-width: 85%;
    }

    .logo-img {
      width: 100%;
      max-height: 180px;
      object-fit: contain;
      filter: drop-shadow(0 0 15px #ff0055) drop-shadow(0 0 30px #00f0ff);
      animation: logoPulse 1.5s infinite alternate ease-in-out;
    }

    .game-logo-text {
      font-family: 'Orbitron', 'Fredoka One', sans-serif;
      font-size: clamp(42px, 9vw, 80px);
      font-weight: 900;
      color: #ffffff;
      line-height: 1.0;
      letter-spacing: 4px;
      text-transform: uppercase;
      background: linear-gradient(180deg, #fff 0%, #ff0055 50%, #ffea00 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 10px rgba(255, 0, 85, 0.8)) drop-shadow(0 0 25px rgba(0, 240, 255, 0.8));
      animation: intenseGlow 1.2s infinite alternate ease-in-out, glitchAnim 2.5s infinite;
    }

    @keyframes logoPulse {
      0% { transform: scale(1); filter: drop-shadow(0 0 15px #ff0055) drop-shadow(0 0 25px #00f0ff); }
      100% { transform: scale(1.05); filter: drop-shadow(0 0 25px #ff0055) drop-shadow(0 0 45px #00f0ff); }
    }

    @keyframes intenseGlow {
      0% { filter: drop-shadow(0 0 8px #ff0055) drop-shadow(0 0 20px #00f0ff); }
      100% { filter: drop-shadow(0 0 20px #ff0055) drop-shadow(0 0 40px #ffea00); }
    }

    @keyframes glitchAnim {
      0%, 92%, 100% { transform: translate(0, 0); }
      93% { transform: translate(-3px, 2px); }
      95% { transform: translate(3px, -2px); }
      97% { transform: translate(-2px, -1px); }
    }

    .overlay-subtext {
      position: relative;
      z-index: 2;
      font-size: clamp(14px, 3.2vw, 20px);
      font-weight: 900;
      color: #ffffff;
      margin-bottom: 20px;
      text-shadow: 1px 1px 3px rgba(0,0,0,0.9);
      background: rgba(0, 0, 0, 0.65);
      padding: 6px 20px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .high-score-display {
      position: relative;
      z-index: 2;
      font-size: clamp(16px, 3.5vw, 22px);
      font-weight: 900;
      color: #4ade80;
      margin-bottom: 12px;
      text-shadow: 0 0 8px rgba(74, 222, 128, 0.6);
    }

    .btn-start {
      position: relative;
      z-index: 30;
      padding: 16px 50px;
      font-family: 'Fredoka One', 'M PLUS Rounded 1c', sans-serif;
      font-size: clamp(20px, 4.5vw, 28px);
      font-weight: 900;
      color: #ffffff;
      background: linear-gradient(180deg, #2ed573 0%, #10ac84 100%);
      border: 3px solid #ffffff;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 5px 0 #0652dd, 0 0 20px rgba(46, 213, 115, 0.6);
      text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
      transition: transform 0.1s;
    }

    .btn-start:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 #0652dd, 0 0 10px rgba(46, 213, 115, 0.4);
    }
  </style>
</head>
<body>

  <div id="game-container">
    <canvas id="gameCanvas"></canvas>

    <div class="ui-layer">
      <div class="header-ui">
        <div class="left-ui">
          <div id="livesVal" class="lives-container">❤️ ❤️</div>
          <div class="score-board">
            <div class="current-score">SCORE: <span id="scoreVal">0</span></div>
            <div class="high-score">BEST: <span id="highScoreVal">0</span></div>
          </div>
        </div>
        <div class="level-badge">LEVEL <span id="levelVal">1</span></div>
        <button id="pauseBtn" class="btn-pause">PAUSE</button>
      </div>
    </div>

    <!-- ポーズ画面 -->
    <div id="pauseOverlay" class="overlay-screen hidden">
      <div class="logo-container">
        <div class="game-logo-text" style="background: linear-gradient(180deg, #fff, #f59e0b); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">PAUSED</div>
      </div>
      <p class="overlay-subtext">一時停止中</p>
      <button id="resumeBtn" class="btn-start" style="background: linear-gradient(180deg, #38bdf8, #0284c7); box-shadow:0 4px 0 #0369a1;">RESUME</button>
    </div>

    <!-- スタート／ゲームオーバー画面 -->
    <div id="overlay" class="overlay-screen">
      <div class="logo-container" id="logoContainer">
        <img src="logo.png" alt="SUPER RUNNER" class="logo-img" id="logoImg" onerror="showTextLogo()">
      </div>

      <div id="highScoreText" class="high-score-display">BEST SCORE: <span id="overlayHighScore">0</span></div>
      <p id="overlayText" class="overlay-subtext">タップしてゲームスタート！</p>
      
      <button id="startBtn" class="btn-start">GAME START</button>
    </div>
  </div>

  <script>
    function showTextLogo() {
      const container = document.getElementById('logoContainer');
      container.innerHTML = '<div class="game-logo-text">SUPER RUNNER</div>';
    }

    // --- 音声・画像設定 ---
    const AUDIO_FILES = { 
      bgm: 'bgm.mp3', 
      jump: 'jump.mp3', 
      score: 'score_milestone.mp3',
      damage: 'damage.mp3' // ライフを失う際の効果音を追加
    };
    const PLAYER_IMAGES = { run1: 'run1.png', run2: 'run2.png', jump: 'jump.png' };

    const bgmAudio = new Audio(AUDIO_FILES.bgm);
    bgmAudio.loop = true;
    bgmAudio.volume = 0.4;

    const jumpAudioBase = new Audio(AUDIO_FILES.jump);
    jumpAudioBase.volume = 0.6;

    const scoreAudioBase = new Audio(AUDIO_FILES.score);
    scoreAudioBase.volume = 0.7;

    const damageAudioBase = new Audio(AUDIO_FILES.damage);
    damageAudioBase.volume = 0.8;

    function playJumpSound() {
      try {
        const soundClone = jumpAudioBase.cloneNode();
        soundClone.volume = 0.6;
        soundClone.play().catch(()=>{});
      } catch(e){}
    }

    function playScoreSound() {
      try {
        const soundClone = scoreAudioBase.cloneNode();
        soundClone.volume = 0.7;
        soundClone.play().catch(()=>{});
      } catch(e){}
    }

    function playDamageSound() {
      try {
        const soundClone = damageAudioBase.cloneNode();
        soundClone.volume = 0.8;
        soundClone.play().catch(()=>{});
      } catch(e){}
    }

    const images = {};
    Object.keys(PLAYER_IMAGES).forEach(key => {
      const img = new Image();
      img.src = PLAYER_IMAGES[key];
      images[key] = img;
    });

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    canvas.width = 800;
    canvas.height = 450;

    const scoreVal = document.getElementById('scoreVal');
    const highScoreVal = document.getElementById('highScoreVal');
    const overlayHighScore = document.getElementById('overlayHighScore');
    const levelVal = document.getElementById('levelVal');
    const livesVal = document.getElementById('livesVal');
    const overlay = document.getElementById('overlay');
    const pauseOverlay = document.getElementById('pauseOverlay');
    const logoContainer = document.getElementById('logoContainer');
    const overlayText = document.getElementById('overlayText');
    const startBtn = document.getElementById('startBtn');
    const pauseBtn = document.getElementById('pauseBtn');
    const resumeBtn = document.getElementById('resumeBtn');

    const GROUND_Y = 370;
    const GRAVITY = 0.85;

    let gameState = 'START';
    let score = 0;
    let level = 1;
    let lives = 2;
    let highScore = localStorage.getItem('runner_highscore') || 0;

    function updateHighScoreDisplays() {
      highScoreVal.textContent = Math.floor(highScore);
      overlayHighScore.textContent = Math.floor(highScore);
    }
    updateHighScoreDisplays();

    let gameSpeed = 6.5;
    let frameCount = 0;

    // --- 超リアルな背景構成要素 ---
    const stars = Array.from({ length: 50 }, () => ({
      x: Math.random() * canvas.width,
      y: Math.random() * (GROUND_Y - 120),
      size: Math.random() * 2 + 0.8,
      alpha: Math.random(),
      twinkleSpeed: Math.random() * 0.05 + 0.01
    }));

    const buildings = Array.from({ length: 12 }, (_, i) => ({
      x: i * 85,
      width: 60 + Math.random() * 40,
      height: 120 + Math.random() * 120,
      windowColor: Math.random() < 0.3 ? '#ff0055' : (Math.random() < 0.6 ? '#00f0ff' : '#fde047'),
      hasBeacon: Math.random() < 0.4
    }));

    // プレイヤーオブジェクト
    const player = {
      x: 80, y: GROUND_Y - 60, width: 50, height: 60,
      velocityY: 0, jumpPower: -15.5, jumpCount: 0, maxJumps: 2,
      isGrounded: false, animFrame: 0,
      invincibleFrames: 0,
      
      reset() {
        this.y = GROUND_Y - this.height;
        this.velocityY = 0;
        this.jumpCount = 0;
        this.isGrounded = true;
        this.animFrame = 0;
        this.invincibleFrames = 0;
      },
      jump() {
        if (this.jumpCount < this.maxJumps) {
          this.velocityY = this.jumpPower;
          this.jumpCount++;
          this.isGrounded = false;
          playJumpSound();
        }
      },
      update() {
        this.velocityY += GRAVITY;
        this.y += this.velocityY;
        if (this.y >= GROUND_Y - this.height) {
          this.y = GROUND_Y - this.height;
          this.velocityY = 0;
          this.isGrounded = true;
          this.jumpCount = 0;
        }
        if (frameCount % 6 === 0) this.animFrame = (this.animFrame + 1) % 2;
        if (this.invincibleFrames > 0) this.invincibleFrames--;
      },
      draw() {
        if (this.invincibleFrames % 6 >= 3) return;

        let currentImg = null;
        if (!this.isGrounded && images.jump && images.jump.complete && images.jump.naturalWidth > 0) currentImg = images.jump;
        else if (this.animFrame === 0 && images.run1 && images.run1.complete && images.run1.naturalWidth > 0) currentImg = images.run1;
        else if (this.animFrame === 1 && images.run2 && images.run2.complete && images.run2.naturalWidth > 0) currentImg = images.run2;

        if (currentImg) {
          ctx.drawImage(currentImg, this.x, this.y, this.width, this.height);
        } else {
          ctx.fillStyle = '#ff4757';
          ctx.fillRect(this.x, this.y, this.width, this.height);
        }
      }
    };

    let obstacles = [];
    let nextObstacleTimer = 0;

    // --- 作りこまれたリアルな障害物 ---
    class Obstacle {
      constructor() {
        const airRatio = Math.min(0.5, 0.25 + level * 0.05);
        this.type = Math.random() < airRatio ? 'AIR' : 'GROUND';
        this.width = this.type === 'GROUND' ? 46 : 48;
        this.height = this.type === 'GROUND' ? 58 : 48;
        this.x = canvas.width + 50;
        this.y = this.type === 'GROUND' ? GROUND_Y - this.height : GROUND_Y - 110 - Math.random() * 35;
        this.rotation = 0;
        this.glowPhase = Math.random() * Math.PI * 2;
      }
      update() { 
        this.x -= gameSpeed; 
        if (this.type === 'AIR') this.rotation += 0.15;
        this.glowPhase += 0.1;
      }
      draw() {
        ctx.save();
        if (this.type === 'GROUND') {
          // --- 地上：ハイテール超グラフィック・メタルスパイク ---
          // 影
          ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
          ctx.beginPath();
          ctx.ellipse(this.x + this.width / 2, GROUND_Y, this.width / 2 + 5, 6, 0, 0, Math.PI * 2);
          ctx.fill();

          // メインボディ（リアルなグラデーションシェーディング）
          const metalGrad = ctx.createLinearGradient(this.x, this.y, this.x + this.width, GROUND_Y);
          metalGrad.addColorStop(0, '#1e293b');
          metalGrad.addColorStop(0.3, '#475569');
          metalGrad.addColorStop(0.7, '#0f172a');
          metalGrad.addColorStop(1, '#020617');

          ctx.fillStyle = metalGrad;
          ctx.beginPath();
          ctx.moveTo(this.x + 4, GROUND_Y);
          ctx.lineTo(this.x + this.width * 0.35, this.y);
          ctx.lineTo(this.x + this.width * 0.6, GROUND_Y - 20);
          ctx.lineTo(this.x + this.width - 2, this.y + 12);
          ctx.lineTo(this.x + this.width, GROUND_Y);
          ctx.closePath();
          ctx.fill();

          // エッジハイライト（金属光沢）
          ctx.strokeStyle = '#94a3b8';
          ctx.lineWidth = 1.5;
          ctx.stroke();

          // 発光線（エネルギーコア）
          const glowAlpha = Math.sin(this.glowPhase) * 0.3 + 0.7;
          ctx.strokeStyle = `rgba(255, 0, 85, ${glowAlpha})`;
          ctx.lineWidth = 2.5;
          ctx.shadowColor = '#ff0055';
          ctx.shadowBlur = 10;
          ctx.beginPath();
          ctx.moveTo(this.x + this.width * 0.35, this.y + 4);
          ctx.lineTo(this.x + this.width * 0.35, GROUND_Y - 5);
          ctx.stroke();
          ctx.shadowBlur = 0;

          // 危険用デンジャーベースプレート
          ctx.fillStyle = '#111';
          ctx.fillRect(this.x - 4, GROUND_Y - 8, this.width + 8, 8);
          ctx.fillStyle = '#eab308';
          for (let i = 0; i < this.width + 6; i += 12) {
            ctx.fillRect(this.x - 4 + i, GROUND_Y - 8, 6, 8);
          }
        } else {
          // --- 空中：精密メカニカル・ソーブレード（ドローン型） ---
          ctx.translate(this.x + this.width / 2, this.y + this.height / 2);
          
          // アウターネオンリング
          ctx.shadowColor = '#00f0ff';
          ctx.shadowBlur = 12;
          ctx.strokeStyle = 'rgba(0, 240, 255, 0.6)';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(0, 0, this.width / 2 + 3, 0, Math.PI * 2);
          ctx.stroke();
          ctx.shadowBlur = 0;

          // 回転鋸刃
          ctx.rotate(this.rotation);
          const r = this.width / 2;
          const bladeGrad = ctx.createRadialGradient(0, 0, 2, 0, 0, r);
          bladeGrad.addColorStop(0, '#f8fafc');
          bladeGrad.addColorStop(0.5, '#64748b');
          bladeGrad.addColorStop(0.9, '#1e293b');
          bladeGrad.addColorStop(1, '#00f0ff');

          ctx.fillStyle = bladeGrad;
          ctx.beginPath();
          const teeth = 12;
          for (let i = 0; i < teeth; i++) {
            const a1 = (Math.PI * 2 / teeth) * i;
            const a2 = a1 + (Math.PI / (teeth * 2));
            const a3 = a1 + (Math.PI / teeth);
            ctx.lineTo(Math.cos(a1) * r, Math.sin(a1) * r);
            ctx.lineTo(Math.cos(a2) * (r * 1.15), Math.sin(a2) * (r * 1.15));
            ctx.lineTo(Math.cos(a3) * (r * 0.7), Math.sin(a3) * (r * 0.7));
          }
          ctx.closePath();
          ctx.fill();

          // 鋸のメカニカル構造（内枠）
          ctx.fillStyle = '#0f172a';
          ctx.beginPath();
          ctx.arc(0, 0, r * 0.55, 0, Math.PI * 2);
          ctx.fill();

          // 核心赤色LED発光部
          ctx.fillStyle = '#ff0055';
          ctx.shadowColor = '#ff0055';
          ctx.shadowBlur = 8;
          ctx.beginPath();
          ctx.arc(0, 0, r * 0.25, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      }
    }

    function checkCollision(r1, r2) {
      return (r1.x + 8 < r2.x + r2.width && r1.x + r1.width - 8 > r2.x && r1.y + 8 < r2.y + r2.height && r1.y + r1.height - 8 > r2.y);
    }

    // --- リアル背景描画システム ---
    function drawBackground() {
      // 1. グラデーション夜空
      const skyGrad = ctx.createLinearGradient(0, 0, 0, GROUND_Y);
      skyGrad.addColorStop(0, '#030712');
      skyGrad.addColorStop(0.4, '#0f0728');
      skyGrad.addColorStop(0.8, '#1f0d3d');
      skyGrad.addColorStop(1, '#3b0764');
      ctx.fillStyle = skyGrad;
      ctx.fillRect(0, 0, canvas.width, GROUND_Y);

      // 2. 星空（またたきアニメーション）
      stars.forEach(s => {
        if (gameState === 'PLAYING') s.x -= s.size * 0.15;
        if (s.x < 0) s.x = canvas.width;
        s.alpha += s.twinkleSpeed;
        if (s.alpha > 1 || s.alpha < 0.2) s.twinkleSpeed = -s.twinkleSpeed;

        ctx.fillStyle = `rgba(255, 255, 255, ${Math.max(0.1, Math.min(1, s.alpha))})`;
        ctx.fillRect(s.x, s.y, s.size, s.size);
      });

      // 3. 超リアルなネオンサイバーシティ（ビル群）
      buildings.forEach(b => {
        if (gameState === 'PLAYING') b.x -= gameSpeed * 0.2;
        if (b.x + b.width < 0) b.x = canvas.width + Math.random() * 40;

        // ビル本体
        const bGrad = ctx.createLinearGradient(b.x, GROUND_Y - b.height, b.x + b.width, GROUND_Y);
        bGrad.addColorStop(0, '#111827');
        bGrad.addColorStop(1, '#030712');
        ctx.fillStyle = bGrad;
        ctx.fillRect(b.x, GROUND_Y - b.height, b.width, b.height);

        // ビルのネオン縁取り
        ctx.strokeStyle = 'rgba(56, 189, 248, 0.15)';
        ctx.lineWidth = 1;
        ctx.strokeRect(b.x, GROUND_Y - b.height, b.width, b.height);

        // ビルの窓の光
        ctx.fillStyle = b.windowColor;
        for (let wy = GROUND_Y - b.height + 12; wy < GROUND_Y - 15; wy += 18) {
          for (let wx = b.x + 6; wx < b.x + b.width - 10; wx += 12) {
            if ((wx * 7 + wy * 13) % 5 < 3) {
              ctx.globalAlpha = 0.6;
              ctx.fillRect(wx, wy, 5, 7);
            }
          }
        }
        ctx.globalAlpha = 1.0;

        // 航空障害灯（赤LED）
        if (b.hasBeacon) {
          const beaconGlow = Math.sin(frameCount * 0.08) * 0.5 + 0.5;
          ctx.fillStyle = `rgba(255, 0, 85, ${beaconGlow})`;
          ctx.beginPath();
          ctx.arc(b.x + b.width / 2, GROUND_Y - b.height - 3, 2.5, 0, Math.PI * 2);
          ctx.fill();
        }
      });

      // 4. 地面（サイバーグリッド・グラデーションライン）
      const groundGrad = ctx.createLinearGradient(0, GROUND_Y, 0, canvas.height);
      groundGrad.addColorStop(0, '#0f172a');
      groundGrad.addColorStop(0.3, '#020617');
      groundGrad.addColorStop(1, '#000000');
      ctx.fillStyle = groundGrad;
      ctx.fillRect(0, GROUND_Y, canvas.width, canvas.height - GROUND_Y);

      // 発光グランドライン
      ctx.shadowColor = '#00f0ff';
      ctx.shadowBlur = 10;
      ctx.fillStyle = '#00f0ff';
      ctx.fillRect(0, GROUND_Y, canvas.width, 3);
      ctx.shadowBlur = 0;

      // グリッドスピードライン
      ctx.strokeStyle = 'rgba(0, 240, 255, 0.25)';
      ctx.lineWidth = 1.5;
      const offset = (frameCount * gameSpeed) % 40;
      for (let x = -offset; x < canvas.width; x += 40) {
        ctx.beginPath();
        ctx.moveTo(x, GROUND_Y);
        ctx.lineTo(x - 20, canvas.height);
        ctx.stroke();
      }
    }

    // ライフ表示の更新 & BGM速度制御
    function updateLivesUI() {
      if (lives === 2) {
        livesVal.textContent = '❤️ ❤️';
        bgmAudio.playbackRate = 1.0;
      } else if (lives === 1) {
        livesVal.textContent = '❤️ 🖤';
        // ライフが残り1つの時、BGM速度を1.2倍に変更
        bgmAudio.playbackRate = 1.2;
      } else {
        livesVal.textContent = '🖤 🖤';
      }
    }

    function togglePause() {
      if (gameState === 'PLAYING') {
        gameState = 'PAUSED';
        bgmAudio.pause();
        pauseOverlay.classList.remove('hidden');
      } else if (gameState === 'PAUSED') {
        gameState = 'PLAYING';
        bgmAudio.play().catch(()=>{});
        pauseOverlay.classList.add('hidden');
      }
    }

    function gameOver() {
      gameState = 'GAMEOVER';
      bgmAudio.pause();
      bgmAudio.playbackRate = 1.0;
      
      if (score > highScore) {
        highScore = score;
        localStorage.setItem('runner_highscore', highScore);
        updateHighScoreDisplays();
        logoContainer.innerHTML = '<div class="game-logo-text" style="background: linear-gradient(180deg, #fff, #2ed573); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">NEW RECORD!</div>';
      } else {
        logoContainer.innerHTML = '<div class="game-logo-text" style="background: linear-gradient(180deg, #fff, #ff4757); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">GAME OVER</div>';
      }
      
      overlayText.innerHTML = `FINAL SCORE: <strong>${Math.floor(score)}</strong> (LEVEL ${level})`;
      startBtn.textContent = 'RETRY';
      overlay.classList.remove('hidden');
    }

    function gameLoop() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      drawBackground();

      if (gameState === 'PLAYING') {
        frameCount++;
        score += gameSpeed * 0.035;
        scoreVal.textContent = Math.floor(score);

        // --- 200点ごとに難易度向上の仕様に変更 ---
        const currentLevel = Math.floor(score / 200) + 1;
        if (currentLevel > level) {
          level = currentLevel;
          levelVal.textContent = level;
          playScoreSound(); // レベルアップ効果音
        }

        // LEVELに伴う速度調整
        gameSpeed = 6.5 + (level - 1) * 0.7;

        player.update();

        // 障害物の生成管理
        nextObstacleTimer--;
        if (nextObstacleTimer <= 0) {
          obstacles.push(new Obstacle());
          const minDelay = Math.max(18, 55 - level * 3);
          nextObstacleTimer = minDelay + Math.random() * 25;
        }

        // 障害物の移動・衝突判定
        for (let i = obstacles.length - 1; i >= 0; i--) {
          const obs = obstacles[i];
          obs.update();

          if (player.invincibleFrames === 0 && checkCollision(player, obs)) {
            lives--;
            playDamageSound(); // 被弾（ライフ損失）効果音を再生
            updateLivesUI();

            if (lives <= 0) {
              gameOver();
            } else {
              player.invincibleFrames = 90; // 被弾後約1.5秒間無敵
            }
          }

          if (obs.x + obs.width < 0) obstacles.splice(i, 1);
        }
      }

      obstacles.forEach(obs => obs.draw());
      player.draw();
      requestAnimationFrame(gameLoop);
    }

    // 操作イベント
    function handleJump(e) {
      if (gameState === 'PLAYING') {
        player.jump();
      }
    }

    window.addEventListener('touchstart', (e) => {
      if (e.target !== startBtn && e.target !== pauseBtn && e.target !== resumeBtn) {
        handleJump(e);
      }
    }, { passive: true });

    window.addEventListener('mousedown', (e) => {
      if (e.target !== startBtn && e.target !== pauseBtn && e.target !== resumeBtn) {
        handleJump(e);
      }
    });

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' || e.code === 'ArrowUp') {
        if (gameState === 'PLAYING') player.jump();
      } else if (e.code === 'KeyP') {
        togglePause();
      }
    });

    // ゲーム開始処理
    function startGame() {
      logoContainer.innerHTML = '<img src="logo.png" alt="SUPER RUNNER" class="logo-img" id="logoImg" onerror="showTextLogo()">';
      score = 0; 
      level = 1;
      lives = 2;
      levelVal.textContent = level;
      updateLivesUI();
      updateHighScoreDisplays();

      gameSpeed = 6.5; 
      obstacles = []; 
      player.reset();
      gameState = 'PLAYING';
      overlay.classList.add('hidden');
      pauseOverlay.classList.add('hidden');

      bgmAudio.currentTime = 0;
      bgmAudio.playbackRate = 1.0;
      bgmAudio.play().catch(()=>{});
    }

    startBtn.addEventListener('click', startGame);
    startBtn.addEventListener('touchend', (e) => {
      e.preventDefault();
      startGame();
    });

    pauseBtn.addEventListener('click', togglePause);
    resumeBtn.addEventListener('click', togglePause);

    gameLoop();
  </script>
</body>
</html>
