<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>SUPER RUNNER</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=M+PLUS+Rounded+1c:wght@800;900&display=swap');

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100svh;
      overflow: hidden;
      background-color: #000000;
      font-family: 'M PLUS Rounded 1c', 'Fredoka One', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* ゲームコンテナ */
    #game-container {
      position: relative;
      width: 100vw;
      height: 100svh;
      max-width: 177.78svh;
      max-height: 56.25vw;
      background: #60a5fa;
      overflow: hidden;
      box-shadow: 0 0 30px rgba(0,0,0,0.8);
      transition: all 0.2s ease;
    }

    /* iOS用 擬似フルスクリーンモード */
    #game-container.is-fullscreen {
      max-width: 100vw !important;
      max-height: 100svh !important;
      width: 100vw !important;
      height: 100svh !important;
      border-radius: 0 !important;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .ui-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 12px 20px;
      z-index: 10;
    }

    .score-board {
      display: flex;
      justify-content: space-between;
      font-size: 20px;
      font-weight: 900;
      text-shadow: 2px 2px 0 #000, -2px -2px 0 #000;
    }

    .score-board .current-score { color: #fde047; }
    .score-board .high-score { color: #4ade80; }

    /* タイトル＆ゲームオーバー画面 */
    .overlay-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      /* タイトル背景を「上部合わせ」に設定 */
      background-image: url('bg_title.png');
      background-size: cover;
      background-position: top center;
      background-repeat: no-repeat;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: auto;
      z-index: 20;
      overflow: hidden;
    }

    .overlay-screen.hidden {
      display: none;
    }

    .overlay-screen::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.2);
      z-index: 1;
    }

    .logo-container {
      position: relative;
      z-index: 2;
      margin-bottom: 15px;
      text-align: center;
      max-width: 65%;
    }

    .logo-img {
      width: 100%;
      max-height: 160px;
      object-fit: contain;
      filter: drop-shadow(0px 6px 10px rgba(0,0,0,0.5));
    }

    .game-logo-text {
      font-size: clamp(32px, 7vw, 56px);
      font-weight: 900;
      color: #ff3838;
      line-height: 1.0;
      letter-spacing: 2px;
      text-shadow: 
        3px 3px 0 #fff,
        -3px -3px 0 #fff,
        3px -3px 0 #fff,
        -3px 3px 0 #fff,
        0 6px 0 #c51111;
    }

    .overlay-subtext {
      position: relative;
      z-index: 2;
      font-size: clamp(14px, 3vw, 18px);
      font-weight: 900;
      color: #ffffff;
      margin-bottom: 15px;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.9);
      background: rgba(0, 0, 0, 0.4);
      padding: 4px 16px;
      border-radius: 20px;
    }

    .btn-start {
      position: relative;
      z-index: 2;
      padding: 12px 40px;
      font-family: 'Fredoka One', 'M PLUS Rounded 1c', sans-serif;
      font-size: clamp(18px, 4vw, 26px);
      font-weight: 900;
      color: #ffffff;
      background: linear-gradient(to bottom, #32ff7e, #10ac84);
      border: 3px solid #ffffff;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 6px 0 #0652dd, 0 8px 15px rgba(0,0,0,0.4);
      text-shadow: 2px 2px 0 rgba(0,0,0,0.4);
    }

    .btn-start:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #0652dd, 0 4px 8px rgba(0,0,0,0.4);
    }

    .fullscreen-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(0,0,0,0.6);
      color: white;
      border: 1px solid rgba(255,255,255,0.6);
      padding: 6px 12px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: bold;
      z-index: 100;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <button class="fullscreen-btn" id="fsBtn" onclick="toggleFullScreen()">全画面表示</button>
    <canvas id="gameCanvas"></canvas>

    <div class="ui-layer">
      <div class="score-board">
        <div class="current-score">SCORE: <span id="scoreVal">0</span></div>
        <div class="high-score">BEST: <span id="highScoreVal">0</span></div>
      </div>
    </div>

    <div id="overlay" class="overlay-screen">
      <div class="logo-container" id="logoContainer">
        <img src="logo.png" alt="SUPER RUNNER" class="logo-img" id="logoImg" onerror="showTextLogo()">
      </div>

      <p id="overlayText" class="overlay-subtext">タップしてゲームスタート！</p>
      
      <button id="startBtn" class="btn-start">GAME START</button>
    </div>
  </div>

  <script>
    // --- 全画面表示処理 (iOS対応の擬似フルスクリーン) ---
    function toggleFullScreen() {
      const container = document.getElementById('game-container');
      const btn = document.getElementById('fsBtn');
      
      container.classList.toggle('is-fullscreen');
      
      if (container.classList.contains('is-fullscreen')) {
        btn.textContent = '元に戻す';
      } else {
        btn.textContent = '全画面表示';
      }

      // 標準APIが使える環境用
      const doc = window.document;
      const docEl = doc.documentElement;
      const requestFS = docEl.requestFullscreen || docEl.webkitRequestFullScreen;
      if (!doc.fullscreenElement && !doc.webkitFullscreenElement) {
        if (requestFS) requestFS.call(docEl).catch(()=>{});
      } else {
        const exitFS = doc.exitFullscreen || doc.webkitExitFullscreen;
        if (exitFS) exitFS.call(doc).catch(()=>{});
      }
    }

    function showTextLogo() {
      const container = document.getElementById('logoContainer');
      container.innerHTML = '<div class="game-logo-text">SUPER RUNNER</div>';
    }

    // --- 音声・画像設定 ---
    const AUDIO_FILES = { bgm: 'bgm.mp3', jump: 'jump.mp3' };
    const PLAYER_IMAGES = { run1: 'run1.png', run2: 'run2.png', jump: 'jump.png' };

    const bgmAudio = new Audio(AUDIO_FILES.bgm);
    bgmAudio.loop = true;
    bgmAudio.volume = 0.4;

    const jumpAudio = new Audio(AUDIO_FILES.jump);
    jumpAudio.volume = 0.6;

    const images = {};
    Object.keys(PLAYER_IMAGES).forEach(key => {
      const img = new Image();
      img.src = PLAYER_IMAGES[key];
      images[key] = img;
    });

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    canvas.width = 800;
    canvas.height = 450;

    const scoreVal = document.getElementById('scoreVal');
    const highScoreVal = document.getElementById('highScoreVal');
    const overlay = document.getElementById('overlay');
    const logoContainer = document.getElementById('logoContainer');
    const overlayText = document.getElementById('overlayText');
    const startBtn = document.getElementById('startBtn');

    const GROUND_Y = 370;
    const GRAVITY = 0.85;

    let gameState = 'START';
    let score = 0;
    let highScore = localStorage.getItem('runner_highscore') || 0;
    highScoreVal.textContent = Math.floor(highScore);

    let gameSpeed = 6.0;
    let frameCount = 0;

    // --- プレイヤーオブジェクト ---
    const player = {
      x: 80, y: GROUND_Y - 60, width: 50, height: 60,
      velocityY: 0, jumpPower: -15.5, jumpCount: 0, maxJumps: 2,
      isGrounded: false, animFrame: 0,
      
      reset() {
        this.y = GROUND_Y - this.height;
        this.velocityY = 0;
        this.jumpCount = 0;
        this.isGrounded = true;
        this.animFrame = 0;
      },
      jump() {
        if (this.jumpCount < this.maxJumps) {
          this.velocityY = this.jumpPower;
          this.jumpCount++;
          this.isGrounded = false;
          jumpAudio.currentTime = 0;
          jumpAudio.play().catch(()=>{});
        }
      },
      update() {
        this.velocityY += GRAVITY;
        this.y += this.velocityY;
        if (this.y >= GROUND_Y - this.height) {
          this.y = GROUND_Y - this.height;
          this.velocityY = 0;
          this.isGrounded = true;
          this.jumpCount = 0;
        }
        if (frameCount % 6 === 0) this.animFrame = (this.animFrame + 1) % 2;
      },
      draw() {
        let currentImg = null;
        if (!this.isGrounded && images.jump && images.jump.complete && images.jump.naturalWidth > 0) currentImg = images.jump;
        else if (this.animFrame === 0 && images.run1 && images.run1.complete && images.run1.naturalWidth > 0) currentImg = images.run1;
        else if (this.animFrame === 1 && images.run2 && images.run2.complete && images.run2.naturalWidth > 0) currentImg = images.run2;

        if (currentImg) {
          ctx.drawImage(currentImg, this.x, this.y, this.width, this.height);
        } else {
          ctx.fillStyle = '#ff4757';
          ctx.fillRect(this.x, this.y, this.width, this.height);
        }
      }
    };

    let obstacles = [];
    let nextObstacleTimer = 0;

    class Obstacle {
      constructor() {
        const airRatio = Math.min(0.5, 0.25 + score * 0.0005);
        this.type = Math.random() < airRatio ? 'AIR' : 'GROUND';
        this.width = this.type === 'GROUND' ? 35 + Math.random() * 20 : 45;
        this.height = this.type === 'GROUND' ? 45 + Math.random() * 30 : 35;
        this.x = canvas.width + 50;
        this.y = this.type === 'GROUND' ? GROUND_Y - this.height : GROUND_Y - 110 - Math.random() * 40;
        this.color = this.type === 'GROUND' ? '#ff4757' : '#ffa502';
      }
      update() { this.x -= gameSpeed; }
      draw() {
        ctx.fillStyle = this.color;
        if (this.type === 'GROUND') {
          ctx.beginPath();
          ctx.moveTo(this.x, this.y + this.height);
          ctx.lineTo(this.x + this.width / 2, this.y);
          ctx.lineTo(this.x + this.width, this.y + this.height);
          ctx.fill();
        } else {
          ctx.fillRect(this.x, this.y, this.width, this.height);
        }
      }
    }

    function checkCollision(r1, r2) {
      return (r1.x + 6 < r2.x + r2.width && r1.x + r1.width - 6 > r2.x && r1.y + 6 < r2.y + r2.height && r1.y + r1.height - 6 > r2.y);
    }

    function gameOver() {
      gameState = 'GAMEOVER';
      bgmAudio.pause();
      
      if (score > highScore) {
        highScore = score;
        localStorage.setItem('runner_highscore', highScore);
        highScoreVal.textContent = Math.floor(highScore);
        logoContainer.innerHTML = '<div class="game-logo-text" style="color:#2ed573;">NEW RECORD!</div>';
      } else {
        logoContainer.innerHTML = '<div class="game-logo-text">GAME OVER</div>';
      }
      
      overlayText.innerHTML = `SCORE: <strong>${Math.floor(score)}</strong>`;
      startBtn.textContent = 'RETRY';
      overlay.classList.remove('hidden');
    }

    function gameLoop() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      ctx.fillStyle = '#2ed573';
      ctx.fillRect(0, GROUND_Y, canvas.width, canvas.height - GROUND_Y);

      if (gameState === 'PLAYING') {
        frameCount++;
        score += gameSpeed * 0.03;
        scoreVal.textContent = Math.floor(score);
        gameSpeed += 0.002;

        player.update();

        nextObstacleTimer--;
        if (nextObstacleTimer <= 0) {
          obstacles.push(new Obstacle());
          nextObstacleTimer = Math.max(30, 85 - gameSpeed * 3.0) + Math.random() * 35;
        }

        for (let i = obstacles.length - 1; i >= 0; i--) {
          const obs = obstacles[i];
          obs.update();
          if (checkCollision(player, obs)) gameOver();
          if (obs.x + obs.width < 0) obstacles.splice(i, 1);
        }
      }

      obstacles.forEach(obs => obs.draw());
      player.draw();
      requestAnimationFrame(gameLoop);
    }

    window.addEventListener('touchstart', (e) => {
      if (e.target !== startBtn && e.target !== document.getElementById('fsBtn') && gameState === 'PLAYING') {
        player.jump();
      }
    }, { passive: true });

    startBtn.addEventListener('click', () => {
      logoContainer.innerHTML = '<img src="logo.png" alt="SUPER RUNNER" class="logo-img" id="logoImg" onerror="showTextLogo()">';
      score = 0; gameSpeed = 6.0; obstacles = []; player.reset();
      gameState = 'PLAYING';
      overlay.classList.add('hidden');
      bgmAudio.currentTime = 0;
      bgmAudio.play().catch(()=>{});
    });

    gameLoop();
  </script>
</body>
</html>
