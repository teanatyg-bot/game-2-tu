<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>SUPER RUNNER - ジャンプ＆ラン</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=M+PLUS+Rounded+1c:wght@800;900&display=swap');

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      margin: 0;
      padding: 0;
      background-color: #1a1a2e;
      color: #ffffff;
      font-family: 'M PLUS Rounded 1c', 'Fredoka One', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      touch-action: manipulation;
    }

    #game-container {
      position: relative;
      width: 100%;
      max-width: 800px;
      aspect-ratio: 16 / 9;
      background: linear-gradient(to bottom, #60a5fa, #93c5fd, #bfdbfe);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
      border-radius: 20px;
      border: 4px solid #ffffff;
      overflow: hidden;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .ui-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 16px 24px;
    }

    .score-board {
      display: flex;
      justify-content: space-between;
      font-size: 22px;
      font-weight: 900;
      text-shadow: 2px 2px 0 #000, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000;
    }

    .score-board .current-score { color: #fde047; }
    .score-board .high-score { color: #4ade80; }

    /* 任天堂ポップ風 タイトル＆ゲームオーバー画面 */
    .overlay-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(6px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: auto;
      transition: opacity 0.2s ease;
    }

    .overlay-screen.hidden {
      opacity: 0;
      pointer-events: none;
    }

    /* 3D立体ポップロゴ */
    .game-logo {
      font-family: 'Fredoka One', 'M PLUS Rounded 1c', sans-serif;
      font-size: 52px;
      margin: 0 0 10px 0;
      color: #ff4757;
      text-align: center;
      line-height: 1.1;
      letter-spacing: 2px;
      text-shadow: 
        4px 4px 0px #ffa502,
        8px 8px 0px #2ed573,
        12px 12px 0px #1e90ff,
        14px 14px 15px rgba(0, 0, 0, 0.5);
      transform: rotate(-3deg);
      animation: logoBounce 2s infinite ease-in-out alternate;
    }

    @keyframes logoBounce {
      0% { transform: rotate(-3deg) scale(1); }
      100% { transform: rotate(-1deg) scale(1.05); }
    }

    p.subtitle {
      font-size: 18px;
      font-weight: 900;
      color: #ffffff;
      margin: 10px 0 25px 0;
      text-align: center;
      padding: 0 20px;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
    }

    /* 任天堂風 プニプニ押せる3Dボタン */
    .btn {
      padding: 16px 48px;
      font-family: 'Fredoka One', 'M PLUS Rounded 1c', sans-serif;
      font-size: 28px;
      font-weight: 900;
      color: #ffffff;
      background: linear-gradient(to bottom, #2ed573, #26af5f);
      border: 4px solid #ffffff;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 8px 0 #1e8449, 0 15px 20px rgba(0,0,0,0.4);
      transition: transform 0.1s, box-shadow 0.1s;
      text-shadow: 2px 2px 0 rgba(0,0,0,0.3);
    }

    .btn:active {
      transform: translateY(6px);
      box-shadow: 0 2px 0 #1e8449, 0 5px 10px rgba(0,0,0,0.4);
    }

    .controls-hint {
      position: absolute;
      bottom: 12px;
      font-size: 14px;
      font-weight: 900;
      color: #ffffff;
      background: rgba(0, 0, 0, 0.5);
      padding: 6px 18px;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.3);
    }
  </style>
</head>
<body>

  <div id="game-container">
    <canvas id="gameCanvas"></canvas>

    <div class="ui-layer">
      <div class="score-board">
        <div class="current-score">SCORE: <span id="scoreVal">0</span></div>
        <div class="high-score">BEST: <span id="highScoreVal">0</span></div>
      </div>
      <div class="controls-hint">画面タップ: ジャンプ（空中でもう1回で2段ジャンプ）</div>
    </div>

    <!-- 任天堂風タイトル＆リトライ画面 -->
    <div id="overlay" class="overlay-screen">
      <h1 id="overlayTitle" class="game-logo">SUPER<br>RUNNER</h1>
      <p id="overlayText" class="subtitle">障害物をかわしてめざせハイスコア！</p>
      <button id="startBtn" class="btn">GAME START</button>
    </div>
  </div>

  <script>
    // -------------------------------------------------------------
    // 音声・画像ファイル設定
    // -------------------------------------------------------------
    const AUDIO_FILES = {
      bgm: 'bgm.mp3',   // BGM
      jump: 'jump.mp3'  // ジャンプ音
    };

    const PLAYER_IMAGES = {
      run1: 'run1.png',
      run2: 'run2.png',
      jump: 'jump.png'
    };

    // オーディオ初期化
    const bgmAudio = new Audio(AUDIO_FILES.bgm);
    bgmAudio.loop = true; // BGMループ再生
    bgmAudio.volume = 0.5;

    const jumpAudio = new Audio(AUDIO_FILES.jump);
    jumpAudio.volume = 0.7;

    // 画像読み込み
    const images = {};
    Object.keys(PLAYER_IMAGES).forEach(key => {
      const img = new Image();
      img.src = PLAYER_IMAGES[key];
      images[key] = img;
    });

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    canvas.width = 800;
    canvas.height = 450;

    const scoreVal = document.getElementById('scoreVal');
    const highScoreVal = document.getElementById('highScoreVal');
    const overlay = document.getElementById('overlay');
    const overlayTitle = document.getElementById('overlayTitle');
    const overlayText = document.getElementById('overlayText');
    const startBtn = document.getElementById('startBtn');

    const GROUND_Y = 370;
    const GRAVITY = 0.85;

    let gameState = 'START';
    let score = 0;
    let highScore = localStorage.getItem('runner_highscore') || 0;
    highScoreVal.textContent = Math.floor(highScore);

    // 難易度調整用変数
    let gameSpeed = 6.0; // 最初は少し控えめな速度からスタート
    let frameCount = 0;

    const player = {
      x: 80,
      y: GROUND_Y - 60,
      width: 50,
      height: 60,
      velocityY: 0,
      jumpPower: -15.5,
      jumpCount: 0,
      maxJumps: 2,
      isGrounded: false,
      animFrame: 0,
      
      reset() {
        this.y = GROUND_Y - this.height;
        this.velocityY = 0;
        this.jumpCount = 0;
        this.isGrounded = true;
        this.animFrame = 0;
      },

      jump() {
        if (this.jumpCount < this.maxJumps) {
          this.velocityY = this.jumpPower;
          this.jumpCount++;
          this.isGrounded = false;
          
          // ジャンプ音再生（連続タップに対応させるため再生位置をリセット）
          jumpAudio.currentTime = 0;
          jumpAudio.play().catch(() => {});

          createParticles(this.x + this.width / 2, this.y + this.height, 8, '#38bdf8');
        }
      },

      update() {
        this.velocityY += GRAVITY;
        this.y += this.velocityY;

        if (this.y >= GROUND_Y - this.height) {
          this.y = GROUND_Y - this.height;
          this.velocityY = 0;
          if (!this.isGrounded) {
            createParticles(this.x + this.width / 2, this.y + this.height, 5, '#cbd5e1');
          }
          this.isGrounded = true;
          this.jumpCount = 0;
        }

        if (frameCount % 6 === 0) {
          this.animFrame = (this.animFrame + 1) % 2;
        }
      },

      draw() {
        let currentImg = null;

        if (!this.isGrounded && images.jump && images.jump.complete && images.jump.naturalWidth > 0) {
          currentImg = images.jump;
        } else if (this.animFrame === 0 && images.run1 && images.run1.complete && images.run1.naturalWidth > 0) {
          currentImg = images.run1;
        } else if (this.animFrame === 1 && images.run2 && images.run2.complete && images.run2.naturalWidth > 0) {
          currentImg = images.run2;
        } else if (images.run1 && images.run1.complete && images.run1.naturalWidth > 0) {
          currentImg = images.run1;
        }

        if (currentImg) {
          ctx.drawImage(currentImg, this.x, this.y, this.width, this.height);
        } else {
          ctx.fillStyle = '#ff4757';
          ctx.fillRect(this.x, this.y, this.width, this.height);
          
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(this.x + 32, this.y + 10, 12, 12);
          ctx.fillStyle = '#0f172a';
          ctx.fillRect(this.x + 38, this.y + 14, 6, 6);

          if (this.isGrounded) {
            ctx.fillStyle = '#2ed573';
            if (this.animFrame === 0) {
              ctx.fillRect(this.x + 5, this.y + this.height, 12, 8);
            } else {
              ctx.fillRect(this.x + 30, this.y + this.height, 12, 8);
            }
          }
        }
      }
    };

    let obstacles = [];
    let nextObstacleTimer = 0;

    class Obstacle {
      constructor() {
        // スコアが上がるにつれて空中障害物の出現率が上昇（最大50%）
        const airRatio = Math.min(0.5, 0.25 + score * 0.0005);
        this.type = Math.random() < airRatio ? 'AIR' : 'GROUND';
        
        this.width = this.type === 'GROUND' ? 35 + Math.random() * 20 : 45;
        this.height = this.type === 'GROUND' ? 45 + Math.random() * 30 : 35;
        this.x = canvas.width + 50;
        
        if (this.type === 'GROUND') {
          this.y = GROUND_Y - this.height;
          this.color = '#ff4757';
        } else {
          this.y = GROUND_Y - 110 - Math.random() * 40;
          this.color = '#ffa502';
        }
      }

      update() {
        this.x -= gameSpeed;
      }

      draw() {
        ctx.fillStyle = this.color;
        ctx.shadowColor = this.color;
        ctx.shadowBlur = 6;
        
        if (this.type === 'GROUND') {
          ctx.beginPath();
          ctx.moveTo(this.x, this.y + this.height);
          ctx.lineTo(this.x + this.width / 2, this.y);
          ctx.lineTo(this.x + this.width, this.y + this.height);
          ctx.closePath();
          ctx.fill();
        } else {
          ctx.fillRect(this.x, this.y, this.width, this.height);
        }
        
        ctx.shadowBlur = 0;
      }
    }

    let particles = [];
    function createParticles(x, y, count, color) {
      for (let i = 0; i < count; i++) {
        particles.push({
          x: x,
          y: y,
          vx: (Math.random() - 0.5) * 6,
          vy: (Math.random() - 0.5) * 6,
          size: Math.random() * 4 + 2,
          color: color,
          life: 20
        });
      }
    }

    function updateParticles() {
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life--;
        if (p.life <= 0) {
          particles.splice(i, 1);
        }
      }
    }

    function drawParticles() {
      particles.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.life / 20;
        ctx.fillRect(p.x, p.y, p.size, p.size);
      });
      ctx.globalAlpha = 1.0;
    }

    function checkCollision(rect1, rect2) {
      const padding = 6;
      return (
        rect1.x + padding < rect2.x + rect2.width &&
        rect1.x + rect1.width - padding > rect2.x &&
        rect1.y + padding < rect2.y + rect2.height &&
        rect1.y + rect1.height - padding > rect2.y
      );
    }

    function resetGame() {
      score = 0;
      gameSpeed = 6.0; // スピード初期化
      obstacles = [];
      particles = [];
      nextObstacleTimer = 0;
      player.reset();
      scoreVal.textContent = '0';
    }

    function gameOver() {
      gameState = 'GAMEOVER';
      
      // BGM一時停止
      bgmAudio.pause();

      createParticles(player.x + player.width / 2, player.y + player.height / 2, 30, '#ff4757');

      if (score > highScore) {
        highScore = score;
        localStorage.setItem('runner_highscore', highScore);
        highScoreVal.textContent = Math.floor(highScore);
        overlayTitle.innerHTML = 'NEW HIGH<br>SCORE!';
        overlayTitle.style.color = '#2ed573';
      } else {
        overlayTitle.innerHTML = 'GAME OVER';
        overlayTitle.style.color = '#ff4757';
      }

      overlayText.innerHTML = `SCORE: <strong>${Math.floor(score)}</strong>`;
      startBtn.textContent = 'RETRY';
      overlay.classList.remove('hidden');
    }

    function gameLoop() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      drawBackground();

      if (gameState === 'PLAYING') {
        frameCount++;
        score += gameSpeed * 0.03;
        scoreVal.textContent = Math.floor(score);

        // ★ 徐々に難易度が上がる仕組み（スピードアップ）
        gameSpeed += 0.002;

        player.update();

        // 障害物の出現間隔もスピードに応じて徐々に狭くなる
        nextObstacleTimer--;
        if (nextObstacleTimer <= 0) {
          obstacles.push(new Obstacle());
          const minInterval = Math.max(30, 85 - gameSpeed * 3.0);
          nextObstacleTimer = minInterval + Math.random() * 35;
        }

        for (let i = obstacles.length - 1; i >= 0; i--) {
          const obs = obstacles[i];
          obs.update();

          if (checkCollision(player, obs)) {
            gameOver();
          }

          if (obs.x + obs.width < 0) {
            obstacles.splice(i, 1);
          }
        }

        updateParticles();
      }

      obstacles.forEach(obs => obs.draw());
      player.draw();
      drawParticles();

      requestAnimationFrame(gameLoop);
    }

    function drawBackground() {
      // 地面
      ctx.fillStyle = '#2ed573';
      ctx.fillRect(0, GROUND_Y, canvas.width, canvas.height - GROUND_Y);

      // 土の層
      ctx.fillStyle = '#70a1ff';
      ctx.fillRect(0, GROUND_Y + 12, canvas.width, canvas.height - GROUND_Y - 12);

      // 地面のライン
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(0, GROUND_Y);
      ctx.lineTo(canvas.width, GROUND_Y);
      ctx.stroke();
    }

    function handleAction(e) {
      if (e.type === 'keydown' && e.code !== 'Space') return;
      if (e.target === startBtn) return;

      if (gameState === 'PLAYING') {
        player.jump();
      }
    }

    window.addEventListener('touchstart', (e) => {
      if (e.target !== startBtn) {
        handleAction(e);
      }
    }, { passive: true });

    window.addEventListener('mousedown', (e) => {
      if (e.target !== startBtn) {
        handleAction(e);
      }
    });

    window.addEventListener('keydown', handleAction);

    // ゲームスタート（BGM再生開始）
    startBtn.addEventListener('click', () => {
      resetGame();
      gameState = 'PLAYING';
      overlay.classList.add('hidden');

      // BGM再生
      bgmAudio.currentTime = 0;
      bgmAudio.play().catch(err => console.log("BGM再生ブロック:", err));
    });

    gameLoop();
  </script>
</body>
</html>
