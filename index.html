<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>SUPER RUNNER</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=M+PLUS+Rounded+1c:wght@800;900&display=swap');

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
    }

    html {
      width: 100%;
      height: 100%;
      background-color: #000000;
    }

    body {
      width: 100%;
      height: 100%;
      /* Safariのアドレスバー非表示化を促すための余白設定 */
      min-height: calc(100vh + 1px);
      overflow: hidden;
      background-color: #000000;
      font-family: 'M PLUS Rounded 1c', 'Fredoka One', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      height: 100svh;
      max-width: 177.78svh;
      max-height: 56.25vw;
      background: #60a5fa;
      overflow: hidden;
    }

    /* 全画面拡張モード */
    #game-container.is-fullscreen {
      max-width: 100vw !important;
      max-height: 100vh !important;
      width: 100vw !important;
      height: 100vh !important;
      height: 100lvh !important;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .ui-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 12px 20px;
      z-index: 10;
    }

    .score-board {
      display: flex;
      justify-content: space-between;
      font-size: 20px;
      font-weight: 900;
      text-shadow: 2px 2px 0 #000, -2px -2px 0 #000;
    }

    .score-board .current-score { color: #fde047; }
    .score-board .high-score { color: #4ade80; }

    .overlay-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url('bg_title.png');
      background-size: cover;
      background-position: top center;
      background-repeat: no-repeat;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: auto;
      z-index: 20;
      overflow: hidden;
    }

    .overlay-screen.hidden {
      display: none;
    }

    .overlay-screen::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.2);
      z-index: 1;
    }

    .logo-container {
      position: relative;
      z-index: 2;
      margin-bottom: 12px;
      text-align: center;
      max-width: 60%;
    }

    .logo-img {
      width: 100%;
      max-height: 140px;
      object-fit: contain;
    }

    .game-logo-text {
      font-size: clamp(32px, 7vw, 56px);
      font-weight: 900;
      color: #ff3838;
      line-height: 1.0;
      letter-spacing: 2px;
      text-shadow: 2px 2px 0 #fff, -2px -2px 0 #fff, 2px -2px 0 #fff, -2px 2px 0 #fff;
    }

    .overlay-subtext {
      position: relative;
      z-index: 2;
      font-size: clamp(14px, 3vw, 18px);
      font-weight: 900;
      color: #ffffff;
      margin-bottom: 12px;
      text-shadow: 1px 1px 3px rgba(0,0,0,0.9);
      background: rgba(0, 0, 0, 0.4);
      padding: 4px 16px;
      border-radius: 20px;
    }

    .btn-start {
      position: relative;
      z-index: 2;
      padding: 12px 40px;
      font-family: 'Fredoka One', 'M PLUS Rounded 1c', sans-serif;
      font-size: clamp(18px, 4vw, 26px);
      font-weight: 900;
      color: #ffffff;
      background: #2ed573;
      border: 3px solid #ffffff;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 4px 0 #0652dd;
      text-shadow: 1px 1px 0 rgba(0,0,0,0.4);
    }

    .btn-start:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #0652dd;
    }

    .fullscreen-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(0,0,0,0.6);
      color: white;
      border: 1px solid rgba(255,255,255,0.6);
      padding: 6px 12px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: bold;
      z-index: 100;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <button class="fullscreen-btn" id="fsBtn" onclick="toggleFullScreen()">全画面表示</button>
    <canvas id="gameCanvas"></canvas>

    <div class="ui-layer">
      <div class="score-board">
        <div class="current-score">SCORE: <span id="scoreVal">0</span></div>
        <div class="high-score">BEST: <span id="highScoreVal">0</span></div>
      </div>
    </div>

    <div id="overlay" class="overlay-screen">
      <div class="logo-container" id="logoContainer">
        <img src="logo.png" alt="SUPER RUNNER" class="logo-img" id="logoImg" onerror="showTextLogo()">
      </div>

      <p id="overlayText" class="overlay-subtext">タップしてゲームスタート！</p>
      
      <button id="startBtn" class="btn-start">GAME START</button>
    </div>
  </div>

  <script>
    // --- Safariのアドレスバー・タブ隠しと全画面切り替え ---
    function hideSafariAddressBar() {
      window.scrollTo(0, 1);
    }

    function toggleFullScreen() {
      const container = document.getElementById('game-container');
      const btn = document.getElementById('fsBtn');
      
      container.classList.toggle('is-fullscreen');
      btn.textContent = container.classList.contains('is-fullscreen') ? '元に戻す' : '全画面表示';
      
      hideSafariAddressBar();
    }

    function showTextLogo() {
      const container = document.getElementById('logoContainer');
      container.innerHTML = '<div class="game-logo-text">SUPER RUNNER</div>';
    }

    // --- 音声・画像設定 ---
    const AUDIO_FILES = { bgm: 'bgm.mp3', jump: 'jump.mp3' };
    const PLAYER_IMAGES = { run1: 'run1.png', run2: 'run2.png', jump: 'jump.png' };

    const bgmAudio = new Audio(AUDIO_FILES.bgm);
    bgmAudio.loop = true;
    bgmAudio.volume = 0.4;

    const jumpAudioBase = new Audio(AUDIO_FILES.jump);
    jumpAudioBase.volume = 0.6;

    // ★ジャンプ音連打対応（複数再生用関数）
    function playJumpSound() {
      const soundClone = jumpAudioBase.cloneNode();
      soundClone.volume = 0.6;
      soundClone.play().catch(()=>{});
    }

    const images = {};
    Object.keys(PLAYER_IMAGES).forEach(key => {
      const img = new Image();
      img.src = PLAYER_IMAGES[key];
      images[key] = img;
    });

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    canvas.width = 800;
    canvas.height = 450;

    const scoreVal = document.getElementById('scoreVal');
    const highScoreVal = document.getElementById('highScoreVal');
    const overlay = document.getElementById('overlay');
    const logoContainer = document.getElementById('logoContainer');
    const overlayText = document.getElementById('overlayText');
    const startBtn = document.getElementById('startBtn');

    const GROUND_Y = 370;
    const GRAVITY = 0.85;

    let gameState = 'START';
    let score = 0;
    let highScore = localStorage.getItem('runner_highscore') || 0;
    highScoreVal.textContent = Math.floor(highScore);

    let gameSpeed = 6.0;
    let frameCount = 0;

    // プレイヤー定義
    const player = {
      x: 80, y: GROUND_Y - 60, width: 50, height: 60,
      velocityY: 0, jumpPower: -15.5, jumpCount: 0, maxJumps: 2,
      isGrounded: false, animFrame: 0,
      
      reset() {
        this.y = GROUND_Y - this.height;
        this.velocityY = 0;
        this.jumpCount = 0;
        this.isGrounded = true;
        this.animFrame = 0;
      },
      jump() {
        if (this.jumpCount < this.maxJumps) {
          this.velocityY = this.jumpPower;
          this.jumpCount++;
          this.isGrounded = false;
          playJumpSound(); // ★連打対応の音声再生
        }
      },
      update() {
        this.velocityY += GRAVITY;
        this.y += this.velocityY;
        if (this.y >= GROUND_Y - this.height) {
          this.y = GROUND_Y - this.height;
          this.velocityY = 0;
          this.isGrounded = true;
          this.jumpCount = 0;
        }
        if (frameCount % 6 === 0) this.animFrame = (this.animFrame + 1) % 2;
      },
      draw() {
        let currentImg = null;
        if (!this.isGrounded && images.jump && images.jump.complete && images.jump.naturalWidth > 0) currentImg = images.jump;
        else if (this.animFrame === 0 && images.run1 && images.run1.complete && images.run1.naturalWidth > 0) currentImg = images.run1;
        else if (this.animFrame === 1 && images.run2 && images.run2.complete &&
