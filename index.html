<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">

  <title>SUPER RUNNER</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=M+PLUS+Rounded+1c:wght@800;900&family=Orbitron:wght@900&display=swap');

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100svh;
      overflow: hidden;
      background-color: #cbd5e1;
      font-family: 'M PLUS Rounded 1c', 'Fredoka One', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #game-container {
      position: relative;
      width: 100vw;
      height: 100svh;
      max-width: 177.78svh;
      max-height: 56.25vw;
      background: #bae6fd;
      overflow: hidden;
      transform: translateZ(0);
      will-change: transform;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
      image-rendering: optimizeSpeed;
      image-rendering: -webkit-optimize-contrast;
      image-rendering: pixelated;
    }

    .ui-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 12px 20px;
      z-index: 10;
    }

    .header-ui {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
    }

    .left-ui {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .lives-container {
      display: flex;
      gap: 4px;
      font-size: 22px;
    }

    .score-board {
      display: flex;
      gap: 15px;
      font-size: 18px;
      font-weight: 900;
    }

    .score-board .current-score { color: #0284c7; }
    .score-board .high-score { color: #15803d; }

    .level-badge {
      font-size: 16px;
      font-weight: 900;
      color: #1e293b;
      background: rgba(255, 255, 255, 0.9);
      padding: 4px 16px;
      border-radius: 20px;
      border: 1px solid #94a3b8;
    }

    .btn-pause {
      pointer-events: auto;
      background: #d97706;
      border: 1px solid #ffffff;
      color: #ffffff;
      font-weight: 900;
      font-family: 'Fredoka One', sans-serif;
      padding: 6px 16px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 15px;
      z-index: 15;
    }

    .btn-pause:active {
      transform: translateY(2px);
    }

    .overlay-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url('bg_title.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: auto;
      z-index: 100;
      overflow: hidden;
    }

    .overlay-screen.hidden {
      display: none !important;
      pointer-events: none !important;
    }

    .overlay-screen::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(241, 245, 249, 0.9);
      z-index: 1;
    }

    .logo-container {
      position: relative;
      z-index: 2;
      margin-bottom: 15px;
      text-align: center;
      max-width: 85%;
    }

    .logo-img {
      width: 100%;
      max-height: 180px;
      object-fit: contain;
    }

    .game-logo-text {
      font-family: 'Orbitron', 'Fredoka One', sans-serif;
      font-size: clamp(38px, 8vw, 70px);
      font-weight: 900;
      color: #0369a1;
      line-height: 1.0;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    .overlay-subtext {
      position: relative;
      z-index: 2;
      font-size: clamp(14px, 3.2vw, 18px);
      font-weight: 900;
      color: #334155;
      margin-bottom: 20px;
      background: #ffffff;
      padding: 6px 20px;
      border-radius: 20px;
      border: 1px solid #cbd5e1;
    }

    .high-score-display {
      position: relative;
      z-index: 2;
      font-size: clamp(16px, 3.5vw, 20px);
      font-weight: 900;
      color: #15803d;
      margin-bottom: 12px;
    }

    .btn-start {
      position: relative;
      z-index: 110;
      pointer-events: auto;
      padding: 14px 46px;
      font-family: 'Fredoka One', 'M PLUS Rounded 1c', sans-serif;
      font-size: clamp(18px, 4vw, 24px);
      font-weight: 900;
      color: #ffffff;
      background: #059669;
      border: 2px solid #ffffff;
      border-radius: 50px;
      cursor: pointer;
      transition: transform 0.1s;
    }

    .btn-start:active {
      transform: translateY(2px);
    }
  </style>
</head>
<body>

  <div id="game-container">
    <canvas id="gameCanvas"></canvas>

    <div class="ui-layer">
      <div class="header-ui">
        <div class="left-ui">
          <div id="livesVal" class="lives-container">❤️ ❤️</div>
          <div class="score-board">
            <div class="current-score">SCORE: <span id="scoreVal">0</span></div>
            <div class="high-score">BEST: <span id="highScoreVal">0</span></div>
          </div>
        </div>
        <div class="level-badge">LEVEL <span id="levelVal">1</span></div>
        <button id="pauseBtn" class="btn-pause">PAUSE</button>
      </div>
    </div>

    <!-- ポーズ画面 -->
    <div id="pauseOverlay" class="overlay-screen hidden">
      <div class="logo-container">
        <div class="game-logo-text" style="color: #d97706;">PAUSED</div>
      </div>
      <p class="overlay-subtext">一時停止中</p>
      <button id="resumeBtn" class="btn-start" style="background: #0284c7;">RESUME</button>
    </div>

    <!-- スタート／ゲームオーバー画面 -->
    <div id="overlay" class="overlay-screen">
      <div class="logo-container" id="logoContainer">
        <img src="logo.png" alt="SUPER RUNNER" class="logo-img" id="logoImg" onerror="showTextLogo()">
      </div>

      <div id="highScoreText" class="high-score-display">BEST SCORE: <span id="overlayHighScore">0</span></div>
      <p id="overlayText" class="overlay-subtext">タップしてゲームスタート！</p>
      
      <button id="startBtn" class="btn-start">GAME START</button>
    </div>
  </div>

  <script>
    function showTextLogo() {
      const container = document.getElementById('logoContainer');
      container.innerHTML = '<div class="game-logo-text">SUPER RUNNER</div>';
    }

    // --- オーディオ設定 ---
    const AUDIO_FILES = { 
      bgm: 'bgm.mp3', 
      jump: 'jump.mp3', 
      score: 'score_milestone.mp3',
      damage: 'damage.mp3'
    };
    const PLAYER_IMAGES = { run1: 'run1.png', run2: 'run2.png', jump: 'jump.png' };

    const bgmAudio = new Audio(AUDIO_FILES.bgm);
    bgmAudio.loop = true;
    bgmAudio.volume = 0.35;

    class SoundPool {
      constructor(src, volume, size = 2) {
        this.pool = [];
        for (let i = 0; i < size; i++) {
          const a = new Audio(src);
          a.volume = volume;
          this.pool.push(a);
        }
        this.index = 0;
      }
      play() {
        const sound = this.pool[this.index];
        sound.currentTime = 0;
        sound.play().catch(()=>{});
        this.index = (this.index + 1) % this.pool.length;
      }
    }

    const jumpPool = new SoundPool(AUDIO_FILES.jump, 0.5, 2);
    const scorePool = new SoundPool(AUDIO_FILES.score, 0.6, 2);
    const damagePool = new SoundPool(AUDIO_FILES.damage, 0.7, 2);

    function playJumpSound() { jumpPool.play(); }
    function playScoreSound() { scorePool.play(); }
    function playDamageSound() { damagePool.play(); }

    const images = {};
    Object.keys(PLAYER_IMAGES).forEach(key => {
      const img = new Image();
      img.src = PLAYER_IMAGES[key];
      images[key] = img;
    });

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d', { alpha: false });
    canvas.width = 800;
    canvas.height = 450;

    const scoreVal = document.getElementById('scoreVal');
    const highScoreVal = document.getElementById('highScoreVal');
    const overlayHighScore = document.getElementById('overlayHighScore');
    const levelVal = document.getElementById('levelVal');
    const livesVal = document.getElementById('livesVal');
    const overlay = document.getElementById('overlay');
    const pauseOverlay = document.getElementById('pauseOverlay');
    const logoContainer = document.getElementById('logoContainer');
    const overlayText = document.getElementById('overlayText');
    const startBtn = document.getElementById('startBtn');
    const pauseBtn = document.getElementById('pauseBtn');
    const resumeBtn = document.getElementById('resumeBtn');

    const GROUND_Y = 370;
    const GRAVITY = 0.85;

    let gameState = 'START';
    let score = 0;
    let level = 1;
    let lives = 2;
    let highScore = localStorage.getItem('runner_highscore') || 0;

    function updateHighScoreDisplays() {
      highScoreVal.textContent = Math.floor(highScore);
      overlayHighScore.textContent = Math.floor(highScore);
    }
    updateHighScoreDisplays();

    let gameSpeed = 8.0;
    let frameCount = 0;

    const skyGrad = ctx.createLinearGradient(0, 0, 0, GROUND_Y);
    skyGrad.addColorStop(0, '#bae6fd');
    skyGrad.addColorStop(0.6, '#e0f2fe');
    skyGrad.addColorStop(1, '#f0f9ff');

    const groundGrad = ctx.createLinearGradient(0, GROUND_Y, 0, canvas.height);
    groundGrad.addColorStop(0, '#15803d');
    groundGrad.addColorStop(1, '#166534');

    const clouds = Array.from({ length: 4 }, () => ({
      x: Math.random() * canvas.width,
      y: 30 + Math.random() * 80,
      width: 80,
      height: 30
    }));

    const mountains = Array.from({ length: 5 }, (_, i) => ({
      x: i * 180,
      width: 200,
      height: 80
    }));

    const player = {
      x: 80, y: GROUND_Y - 60, width: 50, height: 60,
      velocityY: 0, jumpPower: -15.5, jumpCount: 0, maxJumps: 2,
      isGrounded: false, animFrame: 0,
      invincibleFrames: 0,
      
      reset() {
        this.y = GROUND_Y - this.height;
        this.velocityY = 0;
        this.jumpCount = 0;
        this.isGrounded = true;
        this.animFrame = 0;
        this.invincibleFrames = 0;
      },
      jump() {
        if (this.jumpCount < this.maxJumps) {
          this.velocityY = this.jumpPower;
          this.jumpCount++;
          this.isGrounded = false;
          playJumpSound();
        }
      },
      update() {
        this.velocityY += GRAVITY;
        this.y += this.velocityY;
        if (this.y >= GROUND_Y - this.height) {
          this.y = GROUND_Y - this.height;
          this.velocityY = 0;
          this.isGrounded = true;
          this.jumpCount = 0;
        }
        if (frameCount % 6 === 0) this.animFrame = (this.animFrame + 1) % 2;
        if (this.invincibleFrames > 0) this.invincibleFrames--;
      },
      draw() {
        if (this.invincibleFrames > 0 && (this.invincibleFrames & 4)) return;

        let currentImg = null;
        if (!this.isGrounded && images.jump && images.jump.complete && images.jump.naturalWidth > 0) currentImg = images.jump;
        else if (this.animFrame === 0 && images.run1 && images.run1.complete && images.run1.naturalWidth > 0) currentImg = images.run1;
        else if (this.animFrame === 1 && images.run2 && images.run2.complete && images.run2.naturalWidth > 0) currentImg = images.run2;

        if (currentImg) {
          ctx.drawImage(currentImg, this.x, this.y, this.width, this.height);
        } else {
          ctx.fillStyle = '#e11d48';
          ctx.fillRect(this.x, this.y, this.width, this.height);
        }
      }
    };

    let obstacles = [];
    let nextObstacleTimer = 0;

    class Obstacle {
      constructor(forceType = null) {
        this.type = forceType || (Math.random() < 0.4 ? 'AIR' : 'GROUND');
        this.width = this.type === 'GROUND' ? 44 : 46;
        this.height = this.type === 'GROUND' ? 56 : 46;
        this.x = canvas.width + 40;
        this.y = this.type === 'GROUND' ? GROUND_Y - this.height : GROUND_Y - 115;
      }
      update() { 
        this.x -= gameSpeed; 
      }
      draw() {
        if (this.type === 'GROUND') {
          ctx.fillStyle = '#e11d48';
          ctx.beginPath();
          ctx.moveTo(this.x, GROUND_Y);
          ctx.lineTo(this.x + this.width * 0.5, this.y);
          ctx.lineTo(this.x + this.width, GROUND_Y);
          ctx.closePath();
          ctx.fill();

          ctx.fillStyle = '#fde047';
          ctx.fillRect(this.x + 4, GROUND_Y - 12, this.width - 8, 6);
        } else {
          ctx.fillStyle = '#d97706';
          ctx.beginPath();
          ctx.arc(this.x + this.width/2, this.y + this.height/2, this.width/2, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = '#334155';
          ctx.beginPath();
          ctx.arc(this.x + this.width/2, this.y + this.height/2, this.width/4, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    }

    function checkCollision(r1, r2) {
      return (r1.x + 10 < r2.x + r2.width && r1.x + r1.width - 10 > r2.x && r1.y + 10 < r2.y + r2.height && r1.y + r1.height - 10 > r2.y);
    }

    function drawBackground() {
      ctx.fillStyle = skyGrad;
      ctx.fillRect(0, 0, canvas.width, GROUND_Y);

      ctx.fillStyle = 'rgba(251, 191, 36, 0.5)';
      ctx.beginPath();
      ctx.arc(680, 70, 36, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#a7f3d0';
      mountains.forEach(m => {
        if (gameState === 'PLAYING') m.x -= gameSpeed * 0.08;
        if (m.x + m.width < 0) m.x = canvas.width;

        ctx.beginPath();
        ctx.moveTo(m.x, GROUND_Y);
        ctx.lineTo(m.x + m.width * 0.5, GROUND_Y - m.height);
        ctx.lineTo(m.x + m.width, GROUND_Y);
        ctx.closePath();
        ctx.fill();
      });

      ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
      clouds.forEach(c => {
        if (gameState === 'PLAYING') c.x -= gameSpeed * 0.15;
        if (c.x + c.width < 0) c.x = canvas.width;

        ctx.fillRect(c.x, c.y, c.width, c.height);
      });

      ctx.fillStyle = groundGrad;
      ctx.fillRect(0, GROUND_Y, canvas.width, canvas.height - GROUND_Y);

      ctx.fillStyle = '#4ade80';
      ctx.fillRect(0, GROUND_Y, canvas.width, 4);
    }

    function updateLivesUI() {
      if (lives === 2) {
        livesVal.textContent = '❤️ ❤️';
        bgmAudio.playbackRate = 1.0;
      } else if (lives === 1) {
        livesVal.textContent = '❤️ 🖤';
        bgmAudio.playbackRate = 1.1;
      } else {
        livesVal.textContent = '🖤 🖤';
      }
    }

    function togglePause(e) {
      if (e) e.stopPropagation();
      if (gameState === 'PLAYING') {
        gameState = 'PAUSED';
        bgmAudio.pause();
        pauseOverlay.classList.remove('hidden');
      } else if (gameState === 'PAUSED') {
        gameState = 'PLAYING';
        bgmAudio.play().catch(()=>{});
        pauseOverlay.classList.add('hidden');
      }
    }

    function gameOver() {
      gameState = 'GAMEOVER';
      bgmAudio.pause();
      bgmAudio.playbackRate = 1.0;
      
      if (score > highScore) {
        highScore = score;
        localStorage.setItem('runner_highscore', highScore);
        updateHighScoreDisplays();
        logoContainer.innerHTML = '<div class="game-logo-text" style="color: #047857;">NEW RECORD!</div>';
      } else {
        logoContainer.innerHTML = '<div class="game-logo-text" style="color: #be123c;">GAME OVER</div>';
      }
      
      overlayText.innerHTML = `FINAL SCORE: <strong>${Math.floor(score)}</strong> (LEVEL ${level})`;
      startBtn.textContent = 'RETRY';
      overlay.classList.remove('hidden');
    }

    function gameLoop() {
      drawBackground();

      if (gameState === 'PLAYING') {
        frameCount++;
        score += gameSpeed * 0.04;
        scoreVal.textContent = Math.floor(score);

        const currentLevel = Math.floor(score / 100) + 1;
        if (currentLevel > level) {
          level = currentLevel;
          levelVal.textContent = level;
          playScoreSound();
        }

        gameSpeed = 8.0 + (level - 1) * 0.6;

        player.update();

        nextObstacleTimer--;
        if (nextObstacleTimer <= 0) {
          let forcedType = null;
          const lastObs = obstacles[obstacles.length - 1];

          if (lastObs && lastObs.type === 'GROUND' && (canvas.width + 40 - lastObs.x) < 260) {
            forcedType = 'GROUND';
          }

          obstacles.push(new Obstacle(forcedType));

          const minSafeDistanceFrames = Math.ceil((220 / gameSpeed)); 
          nextObstacleTimer = Math.max(minSafeDistanceFrames, 30 - level) + Math.floor(Math.random() * 20);
        }

        for (let i = obstacles.length - 1; i >= 0; i--) {
          const obs = obstacles[i];
          obs.update();

          if (player.invincibleFrames === 0 && checkCollision(player, obs)) {
            lives--;
            playDamageSound();
            updateLivesUI();

            if (lives <= 0) {
              gameOver();
            } else {
              player.invincibleFrames = 75;
            }
          }

          if (obs.x + obs.width < 0) obstacles.splice(i, 1);
        }
      }

      for (let i = 0; i < obstacles.length; i++) {
        obstacles[i].draw();
      }

      player.draw();
      requestAnimationFrame(gameLoop);
    }

    function handleJump(e) {
      if (gameState === 'PLAYING') {
        player.jump();
      }
    }

    // 画面タップ・クリック操作の制御
    window.addEventListener('touchstart', (e) => {
      if (gameState === 'PLAYING' && e.target !== startBtn && e.target !== pauseBtn && e.target !== resumeBtn) {
        e.preventDefault();
        handleJump(e);
      }
    }, { passive: false });

    window.addEventListener('mousedown', (e) => {
      if (gameState === 'PLAYING' && e.target !== startBtn && e.target !== pauseBtn && e.target !== resumeBtn) {
        handleJump(e);
      }
    });

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' || e.code === 'ArrowUp') {
        e.preventDefault();
        if (gameState === 'PLAYING') player.jump();
      } else if (e.code === 'KeyP') {
        togglePause(e);
      }
    });

    // ゲーム開始関数
    function startGame(e) {
      if (e) {
        e.preventDefault();
        e.stopPropagation();
      }

      logoContainer.innerHTML = '<img src="logo.png" alt="SUPER RUNNER" class="logo-img" id="logoImg" onerror="showTextLogo()">';
      score = 0; 
      level = 1;
      lives = 2;
      levelVal.textContent = level;
      updateLivesUI();
      updateHighScoreDisplays();

      gameSpeed = 8.0; 
      obstacles = []; 
      player.reset();
      gameState = 'PLAYING';
      
      overlay.classList.add('hidden');
      pauseOverlay.classList.add('hidden');

      bgmAudio.currentTime = 0;
      bgmAudio.playbackRate = 1.0;
      bgmAudio.play().catch(()=>{});
    }

    // スタート・ポーズボタンのイベント登録（click と touchend を両立）
    startBtn.addEventListener('click', startGame);
    startBtn.addEventListener('touchend', startGame);

    pauseBtn.addEventListener('click', togglePause);
    pauseBtn.addEventListener('touchend', togglePause);

    resumeBtn.addEventListener('click', togglePause);
    resumeBtn.addEventListener('touchend', togglePause);

    // ゲーム起動
    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
