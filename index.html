<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">

  <title>SUPER RUNNER</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=M+PLUS+Rounded+1c:wght@800;900&family=Orbitron:wght@900&display=swap');

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100svh;
      overflow: hidden;
      background-color: #000000;
      font-family: 'M PLUS Rounded 1c', 'Fredoka One', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #game-container {
      position: relative;
      width: 100vw;
      height: 100svh;
      max-width: 177.78svh;
      max-height: 56.25vw;
      background: #000;
      overflow: hidden;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .ui-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 12px 20px;
      z-index: 10;
    }

    .header-ui {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
    }

    .left-ui {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .lives-container {
      display: flex;
      gap: 4px;
      font-size: 24px;
      filter: drop-shadow(0 0 6px rgba(255, 0, 85, 0.8));
    }

    .score-board {
      display: flex;
      gap: 15px;
      font-size: 18px;
      font-weight: 900;
      text-shadow: 2px 2px 0 #000, -2px -2px 0 #000;
    }

    .score-board .current-score { color: #fde047; }
    .score-board .high-score { color: #4ade80; }

    .level-badge {
      font-size: 18px;
      font-weight: 900;
      color: #ffffff;
      background: rgba(15, 23, 42, 0.85);
      padding: 4px 16px;
      border-radius: 20px;
      border: 2px solid #38bdf8;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
      text-shadow: 1px 1px 2px #000;
    }

    .btn-pause {
      pointer-events: auto;
      background: #f59e0b;
      border: 2px solid #ffffff;
      color: #ffffff;
      font-weight: 900;
      font-family: 'Fredoka One', sans-serif;
      padding: 6px 16px;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 3px 0 #b45309;
      font-size: 16px;
    }

    .btn-pause:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #b45309;
    }

    .overlay-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url('bg_title.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: auto;
      z-index: 20;
      overflow: hidden;
    }

    .overlay-screen.hidden {
      display: none !important;
    }

    .overlay-screen::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(2px);
      z-index: 1;
    }

    .logo-container {
      position: relative;
      z-index: 2;
      margin-bottom: 15px;
      text-align: center;
      max-width: 85%;
    }

    .logo-img {
      width: 100%;
      max-height: 180px;
      object-fit: contain;
      filter: drop-shadow(0 0 15px #ff0055) drop-shadow(0 0 30px #00f0ff);
      animation: logoPulse 1.5s infinite alternate ease-in-out;
    }

    .game-logo-text {
      font-family: 'Orbitron', 'Fredoka One', sans-serif;
      font-size: clamp(42px, 9vw, 80px);
      font-weight: 900;
      color: #ffffff;
      line-height: 1.0;
      letter-spacing: 4px;
      text-transform: uppercase;
      background: linear-gradient(180deg, #fff 0%, #ff0055 50%, #ffea00 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 10px rgba(255, 0, 85, 0.8)) drop-shadow(0 0 25px rgba(0, 240, 255, 0.8));
      animation: intenseGlow 1.2s infinite alternate ease-in-out;
    }

    @keyframes logoPulse {
      0% { transform: scale(1); }
      100% { transform: scale(1.05); }
    }

    @keyframes intenseGlow {
      0% { filter: drop-shadow(0 0 8px #ff0055); }
      100% { filter: drop-shadow(0 0 20px #ffea00); }
    }

    .overlay-subtext {
      position: relative;
      z-index: 2;
      font-size: clamp(14px, 3.2vw, 20px);
      font-weight: 900;
      color: #ffffff;
      margin-bottom: 20px;
      text-shadow: 1px 1px 3px rgba(0,0,0,0.9);
      background: rgba(0, 0, 0, 0.65);
      padding: 6px 20px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .high-score-display {
      position: relative;
      z-index: 2;
      font-size: clamp(16px, 3.5vw, 22px);
      font-weight: 900;
      color: #4ade80;
      margin-bottom: 12px;
      text-shadow: 0 0 8px rgba(74, 222, 128, 0.6);
    }

    .btn-start {
      position: relative;
      z-index: 30;
      padding: 16px 50px;
      font-family: 'Fredoka One', 'M PLUS Rounded 1c', sans-serif;
      font-size: clamp(20px, 4.5vw, 28px);
      font-weight: 900;
      color: #ffffff;
      background: linear-gradient(180deg, #2ed573 0%, #10ac84 100%);
      border: 3px solid #ffffff;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 5px 0 #0652dd, 0 0 20px rgba(46, 213, 115, 0.6);
      text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
      transition: transform 0.1s;
    }

    .btn-start:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 #0652dd;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <canvas id="gameCanvas"></canvas>

    <div class="ui-layer">
      <div class="header-ui">
        <div class="left-ui">
          <div id="livesVal" class="lives-container">❤️ ❤️</div>
          <div class="score-board">
            <div class="current-score">SCORE: <span id="scoreVal">0</span></div>
            <div class="high-score">BEST: <span id="highScoreVal">0</span></div>
          </div>
        </div>
        <div class="level-badge">LEVEL <span id="levelVal">1</span></div>
        <button id="pauseBtn" class="btn-pause">PAUSE</button>
      </div>
    </div>

    <!-- ポーズ画面 -->
    <div id="pauseOverlay" class="overlay-screen hidden">
      <div class="logo-container">
        <div class="game-logo-text" style="background: linear-gradient(180deg, #fff, #f59e0b); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">PAUSED</div>
      </div>
      <p class="overlay-subtext">一時停止中</p>
      <button id="resumeBtn" class="btn-start" style="background: linear-gradient(180deg, #38bdf8, #0284c7); box-shadow:0 4px 0 #0369a1;">RESUME</button>
    </div>

    <!-- スタート／ゲームオーバー画面 -->
    <div id="overlay" class="overlay-screen">
      <div class="logo-container" id="logoContainer">
        <img src="logo.png" alt="SUPER RUNNER" class="logo-img" id="logoImg" onerror="showTextLogo()">
      </div>

      <div id="highScoreText" class="high-score-display">BEST SCORE: <span id="overlayHighScore">0</span></div>
      <p id="overlayText" class="overlay-subtext">タップしてゲームスタート！</p>
      
      <button id="startBtn" class="btn-start">GAME START</button>
    </div>
  </div>

  <script>
    function showTextLogo() {
      const container = document.getElementById('logoContainer');
      container.innerHTML = '<div class="game-logo-text">SUPER RUNNER</div>';
    }

    // --- 音声・画像設定 ---
    const AUDIO_FILES = { 
      bgm: 'bgm.mp3', 
      jump: 'jump.mp3', 
      score: 'score_milestone.mp3',
      damage: 'damage.mp3'
    };
    const PLAYER_IMAGES = { run1: 'run1.png', run2: 'run2.png', jump: 'jump.png' };

    const bgmAudio = new Audio(AUDIO_FILES.bgm);
    bgmAudio.loop = true;
    bgmAudio.volume = 0.4;

    const jumpAudioBase = new Audio(AUDIO_FILES.jump);
    jumpAudioBase.volume = 0.6;

    const scoreAudioBase = new Audio(AUDIO_FILES.score);
    scoreAudioBase.volume = 0.7;

    const damageAudioBase = new Audio(AUDIO_FILES.damage);
    damageAudioBase.volume = 0.8;

    function playJumpSound() {
      try {
        const soundClone = jumpAudioBase.cloneNode();
        soundClone.volume = 0.6;
        soundClone.play().catch(()=>{});
      } catch(e){}
    }

    function playScoreSound() {
      try {
        const soundClone = scoreAudioBase.cloneNode();
        soundClone.volume = 0.7;
        soundClone.play().catch(()=>{});
      } catch(e){}
    }

    function playDamageSound() {
      try {
        const soundClone = damageAudioBase.cloneNode();
        soundClone.volume = 0.8;
        soundClone.play().catch(()=>{});
      } catch(e){}
    }

    const images = {};
    Object.keys(PLAYER_IMAGES).forEach(key => {
      const img = new Image();
      img.src = PLAYER_IMAGES[key];
      images[key] = img;
    });

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    canvas.width = 800;
    canvas.height = 450;

    const scoreVal = document.getElementById('scoreVal');
    const highScoreVal = document.getElementById('highScoreVal');
    const overlayHighScore = document.getElementById('overlayHighScore');
    const levelVal = document.getElementById('levelVal');
    const livesVal = document.getElementById('livesVal');
    const overlay = document.getElementById('overlay');
    const pauseOverlay = document.getElementById('pauseOverlay');
    const logoContainer = document.getElementById('logoContainer');
    const overlayText = document.getElementById('overlayText');
    const startBtn = document.getElementById('startBtn');
    const pauseBtn = document.getElementById('pauseBtn');
    const resumeBtn = document.getElementById('resumeBtn');

    const GROUND_Y = 370;
    const GRAVITY = 0.85;

    let gameState = 'START';
    let score = 0;
    let level = 1;
    let lives = 2;
    let highScore = localStorage.getItem('runner_highscore') || 0;

    function updateHighScoreDisplays() {
      highScoreVal.textContent = Math.floor(highScore);
      overlayHighScore.textContent = Math.floor(highScore);
    }
    updateHighScoreDisplays();

    // 基本難易度の向上：初期スピードを8.0に引き上げ
    let gameSpeed = 8.0;
    let frameCount = 0;

    // --- 目に優しい静的な背景構成要素（チカチカしない） ---
    const stars = Array.from({ length: 35 }, () => ({
      x: Math.random() * canvas.width,
      y: Math.random() * (GROUND_Y - 120),
      size: Math.random() * 2 + 1
    }));

    const buildings = Array.from({ length: 8 }, (_, i) => ({
      x: i * 110,
      width: 70 + Math.random() * 30,
      height: 100 + Math.random() * 100
    }));

    // プレイヤーオブジェクト
    const player = {
      x: 80, y: GROUND_Y - 60, width: 50, height: 60,
      velocityY: 0, jumpPower: -15.5, jumpCount: 0, maxJumps: 2,
      isGrounded: false, animFrame: 0,
      invincibleFrames: 0,
      
      reset() {
        this.y = GROUND_Y - this.height;
        this.velocityY = 0;
        this.jumpCount = 0;
        this.isGrounded = true;
        this.animFrame = 0;
        this.invincibleFrames = 0;
      },
      jump() {
        if (this.jumpCount < this.maxJumps) {
          this.velocityY = this.jumpPower;
          this.jumpCount++;
          this.isGrounded = false;
          playJumpSound();
        }
      },
      update() {
        this.velocityY += GRAVITY;
        this.y += this.velocityY;
        if (this.y >= GROUND_Y - this.height) {
          this.y = GROUND_Y - this.height;
          this.velocityY = 0;
          this.isGrounded = true;
          this.jumpCount = 0;
        }
        if (frameCount % 6 === 0) this.animFrame = (this.animFrame + 1) % 2;
        if (this.invincibleFrames > 0) this.invincibleFrames--;
      },
      draw() {
        if (this.invincibleFrames % 6 >= 3) return;

        let currentImg = null;
        if (!this.isGrounded && images.jump && images.jump.complete && images.jump.naturalWidth > 0) currentImg = images.jump;
        else if (this.animFrame === 0 && images.run1 && images.run1.complete && images.run1.naturalWidth > 0) currentImg = images.run1;
        else if (this.animFrame === 1 && images.run2 && images.run2.complete && images.run2.naturalWidth > 0) currentImg = images.run2;

        if (currentImg) {
          ctx.drawImage(currentImg, this.x, this.y, this.width, this.height);
        } else {
          ctx.fillStyle = '#ff4757';
          ctx.fillRect(this.x, this.y, this.width, this.height);
        }
      }
    };

    let obstacles = [];
    let nextObstacleTimer = 0;

    // --- 高コントラストで視認性抜群の障害物 ---
    class Obstacle {
      constructor() {
        // 空中障害物の割合を増やす（難易度アップ）
        const airRatio = Math.min(0.6, 0.35 + level * 0.05);
        this.type = Math.random() < airRatio ? 'AIR' : 'GROUND';
        this.width = this.type === 'GROUND' ? 48 : 50;
        this.height = this.type === 'GROUND' ? 60 : 50;
        this.x = canvas.width + 50;
        this.y = this.type === 'GROUND' ? GROUND_Y - this.height : GROUND_Y - 110 - Math.random() * 30;
        this.rotation = 0;
      }
      update() { 
        this.x -= gameSpeed; 
        if (this.type === 'AIR') this.rotation += 0.12;
      }
      draw() {
        ctx.save();
        if (this.type === 'GROUND') {
          // --- 地上：視認性の高い危険スパイク ---
          // 太い白枠でくっきり浮かび上がらせる
          ctx.strokeStyle = '#ffffff';
          ctx.lineWidth = 4;
          ctx.lineJoin = 'round';

          ctx.beginPath();
          ctx.moveTo(this.x, GROUND_Y);
          ctx.lineTo(this.x + this.width * 0.5, this.y);
          ctx.lineTo(this.x + this.width, GROUND_Y);
          ctx.closePath();
          ctx.stroke();

          // 鮮やかな赤～黒の本体
          const redGrad = ctx.createLinearGradient(this.x, this.y, this.x, GROUND_Y);
          redGrad.addColorStop(0, '#ff1744');
          redGrad.addColorStop(1, '#880015');
          ctx.fillStyle = redGrad;
          ctx.fill();

          // 危険警告ストライプ（黄色と黒の分かりやすい模様）
          ctx.fillStyle = '#ffea00';
          ctx.fillRect(this.x - 2, GROUND_Y - 10, this.width + 4, 10);
          ctx.fillStyle = '#000000';
          for (let i = 0; i < this.width; i += 12) {
            ctx.fillRect(this.x + i, GROUND_Y - 10, 6, 10);
          }
          ctx.strokeStyle = '#ffffff';
          ctx.lineWidth = 2;
          ctx.strokeRect(this.x - 2, GROUND_Y - 10, this.width + 4, 10);

        } else {
          // --- 空中：鮮やかなオレンジの回転ブレード ---
          ctx.translate(this.x + this.width / 2, this.y + this.height / 2);
          
          // 外側の白い輪郭線
          ctx.strokeStyle = '#ffffff';
          ctx.lineWidth = 4;
          ctx.beginPath();
          ctx.arc(0, 0, this.width / 2 + 2, 0, Math.PI * 2);
          ctx.stroke();

          // 鮮やかなネオンオレンジの背景輪郭
          ctx.fillStyle = '#ff9100';
          ctx.beginPath();
          ctx.arc(0, 0, this.width / 2 + 1, 0, Math.PI * 2);
          ctx.fill();

          // 回転ブレード
          ctx.rotate(this.rotation);
          const r = this.width / 2;
          ctx.fillStyle = '#212121';
          ctx.beginPath();
          const teeth = 8;
          for (let i = 0; i < teeth; i++) {
            const a1 = (Math.PI * 2 / teeth) * i;
            const a2 = a1 + (Math.PI / (teeth * 2));
            const a3 = a1 + (Math.PI / teeth);
            ctx.lineTo(Math.cos(a1) * r, Math.sin(a1) * r);
            ctx.lineTo(Math.cos(a2) * (r * 1.2), Math.sin(a2) * (r * 1.2));
            ctx.lineTo(Math.cos(a3) * (r * 0.6), Math.sin(a3) * (r * 0.6));
          }
          ctx.closePath();
          ctx.fill();

          // 中心部の黄色の目立つコア
          ctx.fillStyle = '#ffea00';
          ctx.beginPath();
          ctx.arc(0, 0, r * 0.35, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = '#000';
          ctx.lineWidth = 2;
          ctx.stroke();
        }
        ctx.restore();
      }
    }

    function checkCollision(r1, r2) {
      return (r1.x + 8 < r2.x + r2.width && r1.x + r1.width - 8 > r2.x && r1.y + 8 < r2.y + r2.height && r1.y + r1.height - 8 > r2.y);
    }

    // --- 落ち着いた目に優しい背景描画 ---
    function drawBackground() {
      // 1. 深みのある落ち着いた夜空（チカチカ・点滅なし）
      const skyGrad = ctx.createLinearGradient(0, 0, 0, GROUND_Y);
      skyGrad.addColorStop(0, '#0a0f1d');
      skyGrad.addColorStop(0.7, '#1a233a');
      skyGrad.addColorStop(1, '#252f4a');
      ctx.fillStyle = skyGrad;
      ctx.fillRect(0, 0, canvas.width, GROUND_Y);

      // 2. 静止した星（点滅を排除）
      ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
      stars.forEach(s => {
        if (gameState === 'PLAYING') s.x -= 0.2;
        if (s.x < 0) s.x = canvas.width;
        ctx.fillRect(s.x, s.y, s.size, s.size);
      });

      // 3. フラットなシルエットのビル群（眩しくないシックなデザイン）
      buildings.forEach(b => {
        if (gameState === 'PLAYING') b.x -= gameSpeed * 0.15;
        if (b.x + b.width < 0) b.x = canvas.width + Math.random() * 30;

        ctx.fillStyle = '#0d1527';
        ctx.fillRect(b.x, GROUND_Y - b.height, b.width, b.height);

        // 窓の控えめな光
        ctx.fillStyle = 'rgba(56, 189, 248, 0.25)';
        for (let wy = GROUND_Y - b.height + 15; wy < GROUND_Y - 15; wy += 22) {
          for (let wx = b.x + 8; wx < b.x + b.width - 12; wx += 16) {
            ctx.fillRect(wx, wy, 6, 9);
          }
        }
      });

      // 4. 地面（クッキリとしたコントラスト）
      const groundGrad = ctx.createLinearGradient(0, GROUND_Y, 0, canvas.height);
      groundGrad.addColorStop(0, '#1e293b');
      groundGrad.addColorStop(1, '#0f172a');
      ctx.fillStyle = groundGrad;
      ctx.fillRect(0, GROUND_Y, canvas.width, canvas.height - GROUND_Y);

      // 境界のハッキリした芝生・境界線
      ctx.fillStyle = '#38bdf8';
      ctx.fillRect(0, GROUND_Y, canvas.width, 4);

      // 走行感のある白いスピードライン
      ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
      const offset = (frameCount * gameSpeed) % 50;
      for (let x = -offset; x < canvas.width; x += 50) {
        ctx.fillRect(x, GROUND_Y + 14, 24, 4);
      }
    }

    // ライフ表示の更新 & BGM速度制御
    function updateLivesUI() {
      if (lives === 2) {
        livesVal.textContent = '❤️ ❤️';
        bgmAudio.playbackRate = 1.0;
      } else if (lives === 1) {
        livesVal.textContent = '❤️ 🖤';
        bgmAudio.playbackRate = 1.2;
      } else {
        livesVal.textContent = '🖤 🖤';
      }
    }

    function togglePause() {
      if (gameState === 'PLAYING') {
        gameState = 'PAUSED';
        bgmAudio.pause();
        pauseOverlay.classList.remove('hidden');
      } else if (gameState === 'PAUSED') {
        gameState = 'PLAYING';
        bgmAudio.play().catch(()=>{});
        pauseOverlay.classList.add('hidden');
      }
    }

    function gameOver() {
      gameState = 'GAMEOVER';
      bgmAudio.pause();
      bgmAudio.playbackRate = 1.0;
      
      if (score > highScore) {
        highScore = score;
        localStorage.setItem('runner_highscore', highScore);
        updateHighScoreDisplays();
        logoContainer.innerHTML = '<div class="game-logo-text" style="background: linear-gradient(180deg, #fff, #2ed573); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">NEW RECORD!</div>';
      } else {
        logoContainer.innerHTML = '<div class="game-logo-text" style="background: linear-gradient(180deg, #fff, #ff4757); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">GAME OVER</div>';
      }
      
      overlayText.innerHTML = `FINAL SCORE: <strong>${Math.floor(score)}</strong> (LEVEL ${level})`;
      startBtn.textContent = 'RETRY';
      overlay.classList.remove('hidden');
    }

    function gameLoop() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      drawBackground();

      if (gameState === 'PLAYING') {
        frameCount++;
        score += gameSpeed * 0.04;
        scoreVal.textContent = Math.floor(score);

        // --- 100点ごとに難易度上昇＋効果音 ---
        const currentLevel = Math.floor(score / 100) + 1;
        if (currentLevel > level) {
          level = currentLevel;
          levelVal.textContent = level;
          playScoreSound();
        }

        // 基本難易度強化：レベルアップごとに速度も急上昇
        gameSpeed = 8.0 + (level - 1) * 0.8;

        player.update();

        // 障害物の生成管理（出現頻度アップ）
        nextObstacleTimer--;
        if (nextObstacleTimer <= 0) {
          obstacles.push(new Obstacle());
          const minDelay = Math.max(15, 45 - level * 2.5);
          nextObstacleTimer = minDelay + Math.random() * 20;
        }

        // 障害物の移動・衝突判定
        for (let i = obstacles.length - 1; i >= 0; i--) {
          const obs = obstacles[i];
          obs.update();

          if (player.invincibleFrames === 0 && checkCollision(player, obs)) {
            lives--;
            playDamageSound();
            updateLivesUI();

            if (lives <= 0) {
              gameOver();
            } else {
              player.invincibleFrames = 90;
            }
          }

          if (obs.x + obs.width < 0) obstacles.splice(i, 1);
        }
      }

      obstacles.forEach(obs => obs.draw());
      player.draw();
      requestAnimationFrame(gameLoop);
    }

    // 操作イベント
    function handleJump(e) {
      if (gameState === 'PLAYING') {
        player.jump();
      }
    }

    window.addEventListener('touchstart', (e) => {
      if (e.target !== startBtn && e.target !== pauseBtn && e.target !== resumeBtn) {
        handleJump(e);
      }
    }, { passive: true });

    window.addEventListener('mousedown', (e) => {
      if (e.target !== startBtn && e.target !== pauseBtn && e.target !== resumeBtn) {
        handleJump(e);
      }
    });

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' || e.code === 'ArrowUp') {
        if (gameState === 'PLAYING') player.jump();
      } else if (e.code === 'KeyP') {
        togglePause();
      }
    });

    // ゲーム開始処理
    function startGame() {
      logoContainer.innerHTML = '<img src="logo.png" alt="SUPER RUNNER" class="logo-img" id="logoImg" onerror="showTextLogo()">';
      score = 0; 
      level = 1;
      lives = 2;
      levelVal.textContent = level;
      updateLivesUI();
      updateHighScoreDisplays();

      gameSpeed = 8.0; 
      obstacles = []; 
      player.reset();
      gameState = 'PLAYING';
      overlay.classList.add('hidden');
      pauseOverlay.classList.add('hidden');

      bgmAudio.currentTime = 0;
      bgmAudio.playbackRate = 1.0;
      bgmAudio.play().catch(()=>{});
    }

    startBtn.addEventListener('click', startGame);
    startBtn.addEventListener('touchend', (e) => {
      e.preventDefault();
      startGame();
    });

    pauseBtn.addEventListener('click', togglePause);
    resumeBtn.addEventListener('click', togglePause);

    gameLoop();
  </script>
</body>
</html>
