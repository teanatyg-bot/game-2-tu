<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECLIPSE SHADOWS - エクリプス・シャドウズ</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #05050d;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #ffffff;
        }

        /* 共通キャンバス背景 */
        #bg-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* UIコンテナ */
        .ui-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.5s ease, visibility 0.5s;
        }

        .hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        /* タイトル画面 */
        .title-container {
            text-align: center;
            max-width: 800px;
            padding: 20px;
            z-index: 12;
        }

        /* 指定画像のスタイル */
        .title-logo-img {
            max-width: 80%;
            max-height: 220px;
            object-fit: contain;
            filter: drop-shadow(0 0 20px rgba(0, 229, 255, 0.6));
            margin-bottom: 20px;
            animation: float 4s ease-in-out infinite;
        }

        /* 画像非表示時のテキストフォールバック */
        .fallback-title {
            display: none;
            font-size: 3.5rem;
            font-weight: 900;
            letter-spacing: 8px;
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 50%, #00c6ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(0, 242, 254, 0.5);
            margin-bottom: 10px;
            animation: float 4s ease-in-out infinite;
        }

        .subtitle {
            font-size: 1.1rem;
            color: #a0aec0;
            letter-spacing: 4px;
            margin-bottom: 40px;
            text-transform: uppercase;
        }

        /* アニメーションボタン */
        .btn {
            position: relative;
            padding: 16px 48px;
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: 3px;
            color: #ffffff;
            background: rgba(15, 23, 42, 0.7);
            border: 2px solid #00f2fe;
            border-radius: 50px;
            cursor: pointer;
            outline: none;
            overflow: hidden;
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.3), inset 0 0 15px rgba(0, 242, 254, 0.3);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(8px);
        }

        .btn:hover {
            background: #00f2fe;
            color: #05050d;
            box-shadow: 0 0 35px rgba(0, 242, 254, 0.8);
            transform: translateY(-3px) scale(1.03);
        }

        .btn:active {
            transform: translateY(1px) scale(0.98);
        }

        .controls-hint {
            margin-top: 30px;
            font-size: 0.9rem;
            color: #718096;
            line-height: 1.6;
        }

        /* ゲームプレイ画面 UI */
        #hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 25px 35px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            z-index: 10;
            pointer-events: none;
        }

        .hud-item {
            display: flex;
            flex-direction: column;
        }

        .hud-label {
            font-size: 0.75rem;
            letter-spacing: 2px;
            color: #718096;
            text-transform: uppercase;
        }

        .hud-value {
            font-size: 1.8rem;
            font-weight: 800;
            color: #00f2fe;
            text-shadow: 0 0 10px rgba(0, 242, 254, 0.5);
        }

        .health-bar-container {
            width: 220px;
            height: 12px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid rgba(0, 242, 254, 0.3);
            margin-top: 5px;
        }

        .health-bar-fill {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #ff0055, #00f2fe);
            box-shadow: 0 0 10px #00f2fe;
            transition: width 0.2s ease-out;
        }

        /* ゲームオーバー画面 */
        .game-over-container {
            text-align: center;
            background: rgba(10, 15, 30, 0.85);
            padding: 40px 60px;
            border-radius: 20px;
            border: 1px solid rgba(255, 0, 85, 0.4);
            box-shadow: 0 0 40px rgba(255, 0, 85, 0.2);
            backdrop-filter: blur(12px);
        }

        .game-over-title {
            font-size: 3rem;
            font-weight: 900;
            color: #ff0055;
            text-shadow: 0 0 20px rgba(255, 0, 85, 0.6);
            margin-bottom: 20px;
            letter-spacing: 4px;
        }

        .score-result {
            font-size: 1.2rem;
            color: #cbd5e0;
            margin-bottom: 10px;
        }

        .final-score {
            font-size: 2.5rem;
            font-weight: 800;
            color: #00f2fe;
            margin-bottom: 30px;
            text-shadow: 0 0 15px rgba(0, 242, 254, 0.5);
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-12px); }
        }
    </style>
</head>
<body>

    <!-- 背景・ゲーム共有描画キャンバス -->
    <canvas id="bg-canvas"></canvas>

    <!-- HUD (ゲームプレイ中のUI) -->
    <div id="hud" class="hidden">
        <div class="hud-item">
            <span class="hud-label">Energy Barrier</span>
            <div class="health-bar-container">
                <div id="health-bar" class="health-bar-fill"></div>
            </div>
        </div>
        <div class="hud-item" style="align-items: flex-end;">
            <span class="hud-label">Score</span>
            <span id="score-display" class="hud-value">0</span>
        </div>
    </div>

    <!-- スタートタイトル画面 -->
    <div id="title-screen" class="ui-screen">
        <div class="title-container">
            <!-- 指定タイトル画像 (読み込み失敗時はテキスト表示) -->
            <img id="title-img" class="title-logo-img" src="title.png" alt="ECLIPSE SHADOWS" onerror="handleImageError(this)">
            <h1 id="fallback-title" class="fallback-title">ECLIPSE SHADOWS</h1>
            
            <p class="subtitle">光と影のサイバーアクション</p>
            <button id="start-btn" class="btn">ゲームスタート</button>
            <div class="controls-hint">
                [操作方法]<br>
                移動: マウス追従 または キーボード [W][A][S][D] / [矢印キー]<br>
                クリック / スペースキー: エナジーパルス（範囲攻撃）
            </div>
        </div>
    </div>

    <!-- リザルト（ゲームオーバー）画面 -->
    <div id="game-over-screen" class="ui-screen hidden">
        <div class="game-over-container">
            <h2 class="game-over-title">SYSTEM OFFLINE</h2>
            <p class="score-result">獲得スコア</p>
            <div id="final-score-display" class="final-score">0</div>
            <button id="restart-btn" class="btn">再起動 (RESTART)</button>
        </div>
    </div>

    <script>
        // 画像読み込みエラー時の対応処理
        function handleImageError(img) {
            img.style.display = 'none';
            document.getElementById('fallback-title').style.display = 'block';
        }

        // Web Audio API による効果音生成システム
        class SoundFX {
            constructor() {
                this.ctx = null;
            }

            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            playStart() {
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                
                osc.type = 'sine';
                osc.frequency.setValueAtTime(220, now);
                osc.frequency.exponentialRampToValueAtTime(880, now + 0.4);
                
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.4);
                
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.4);
            }

            playCollect() {
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(523.25, now);
                osc.frequency.setValueAtTime(659.25, now + 0.08);
                osc.frequency.setValueAtTime(783.99, now + 0.16);
                
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.25);
                
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.25);
            }

            playHit() {
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.exponentialRampToValueAtTime(40, now + 0.2);
                
                gain.gain.setValueAtTime(0.4, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
                
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.2);
            }

            playPulse() {
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.exponentialRampToValueAtTime(100, now + 0.3);
                
                gain.gain.setValueAtTime(0.4, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
                
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.3);
            }
        }

        const audio = new SoundFX();

        // ゲームシステム本体
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        function resizeCanvas() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // ゲーム状態
        let gameState = 'title'; // 'title', 'playing', 'gameover'
        let score = 0;
        let health = 100;
        let frameCount = 0;

        // プレイヤーオブジェクト
        const player = {
            x: width / 2,
            y: height / 2,
            radius: 16,
            targetX: width / 2,
            targetY: height / 2,
            speed: 0.15,
            pulseRadius: 0,
            pulseActive: false,
            pulseMaxRadius: 150
        };

        // 配列管理
        let bgParticles = [];
        let enemies = [];
        let crystals = [];
        let fxParticles = [];

        // 入力管理
        const keys = {};
        window.addEventListener('keydown', e => {
            keys[e.code] = true;
            if (e.code === 'Space' && gameState === 'playing') {
                triggerPulse();
            }
        });
        window.addEventListener('keyup', e => keys[e.code] = false);

        window.addEventListener('mousemove', e => {
            if (gameState === 'playing') {
                player.targetX = e.clientX;
                player.targetY = e.clientY;
            }
        });

        window.addEventListener('mousedown', e => {
            if (gameState === 'playing' && e.button === 0) {
                triggerPulse();
            }
        });

        // パルス（範囲攻撃）
        function triggerPulse() {
            if (!player.pulseActive) {
                player.pulseActive = true;
                player.pulseRadius = player.radius;
                audio.playPulse();
            }
        }

        // 背景浮遊粒子の初期化
        for (let i = 0; i < 70; i++) {
            bgParticles.push({
                x: Math.random() * width,
                y: Math.random() * height,
                radius: Math.random() * 2 + 0.5,
                vx: (Math.random() - 0.5) * 0.4,
                vy: (Math.random() - 0.5) * 0.4,
                alpha: Math.random() * 0.6 + 0.2
            });
        }

        // ゲームリセット
        function resetGame() {
            score = 0;
            health = 100;
            enemies = [];
            crystals = [];
            fxParticles = [];
            player.x = width / 2;
            player.y = height / 2;
            player.targetX = width / 2;
            player.targetY = height / 2;
            player.pulseActive = false;

            document.getElementById('health-bar').style.width = '100%';
            document.getElementById('score-display').textContent = '0';
        }

        // スタートボタン処理の紐付け
        document.getElementById('start-btn').addEventListener('click', () => {
            audio.init();
            audio.playStart();
            
            document.getElementById('title-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            
            resetGame();
            gameState = 'playing';
        });

        document.getElementById('restart-btn').addEventListener('click', () => {
            audio.init();
            audio.playStart();
            
            document.getElementById('game-over-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            
            resetGame();
            gameState = 'playing';
        });

        // 破片エフェクトの生成
        function createExplosion(x, y, color, count = 12) {
            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 4 + 1;
                fxParticles.push({
                    x: x,
                    y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    radius: Math.random() * 3 + 1,
                    color: color,
                    life: 1.0,
                    decay: Math.random() * 0.03 + 0.02
                });
            }
        }

        // メインループ
        function loop() {
            frameCount++;
            ctx.clearRect(0, 0, width, height);

            // --- 背景描画 ---
            ctx.fillStyle = '#05050d';
            ctx.fillRect(0, 0, width, height);

            // 背景粒子の更新と描画
            ctx.fillStyle = '#00f2fe';
            bgParticles.forEach(p => {
                p.x += p.vx;
                p.y += p.vy;
                if (p.x < 0) p.x = width;
                if (p.x > width) p.x = 0;
                if (p.y < 0) p.y = height;
                if (p.y > height) p.y = 0;

                ctx.save();
                ctx.globalAlpha = p.alpha;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            });

            if (gameState === 'playing') {
                // --- プレイヤー移動更新 ---
                // キーボード操作処理
                let kbSpeed = 6;
                if (keys['KeyW'] || keys['ArrowUp']) player.targetY -= kbSpeed;
                if (keys['KeyS'] || keys['ArrowDown']) player.targetY += kbSpeed;
                if (keys['KeyA'] || keys['ArrowLeft']) player.targetX -= kbSpeed;
                if (keys['KeyD'] || keys['ArrowRight']) player.targetX += kbSpeed;

                // 画面端の制限
                player.targetX = Math.max(player.radius, Math.min(width - player.radius, player.targetX));
                player.targetY = Math.max(player.radius, Math.min(height - player.radius, player.targetY));

                // 滑らかな補間移動
                player.x += (player.targetX - player.x) * player.speed;
                player.y += (player.targetY - player.y) * player.speed;

                // --- 敵の生成 ---
                if (frameCount % 45 === 0) {
                    const side = Math.floor(Math.random() * 4);
                    let ex, ey;
                    if (side === 0) { ex = Math.random() * width; ey = -20; }
                    else if (side === 1) { ex = width + 20; ey = Math.random() * height; }
                    else if (side === 2) { ex = Math.random() * width; ey = height + 20; }
                    else { ex = -20; ey = Math.random() * height; }

                    const angle = Math.atan2(player.y - ey, player.x - ex);
                    enemies.push({
                        x: ex,
                        y: ey,
                        vx: Math.cos(angle) * (2 + Math.random() * 1.5),
                        vy: Math.sin(angle) * (2 + Math.random() * 1.5),
                        radius: 14 + Math.random() * 6
                    });
                }

                // --- クリスタル（エネルギーアイテム）生成 ---
                if (frameCount % 90 === 0 && crystals.length < 8) {
                    crystals.push({
                        x: Math.random() * (width - 100) + 50,
                        y: Math.random() * (height - 100) + 50,
                        radius: 8,
                        pulse: 0
                    });
                }

                // --- パルス（範囲攻撃）の更新 ---
                if (player.pulseActive) {
                    player.pulseRadius += 8;
                    ctx.save();
                    ctx.beginPath();
                    ctx.arc(player.x, player.y, player.pulseRadius, 0, Math.PI * 2);
                    ctx.strokeStyle = 'rgba(0, 242, 254, ' + (1 - player.pulseRadius / player.pulseMaxRadius) + ')';
                    ctx.lineWidth = 4;
                    ctx.stroke();
                    ctx.restore();

                    // パルスと敵の判定
                    enemies.forEach((enemy, index) => {
                        const dist = Math.hypot(enemy.x - player.x, enemy.y - player.y);
                        if (Math.abs(dist - player.pulseRadius) < enemy.radius + 10) {
                            createExplosion(enemy.x, enemy.y, '#ff0055', 10);
                            enemies.splice(index, 1);
                            score += 150;
                            document.getElementById('score-display').textContent = score;
                        }
                    });

                    if (player.pulseRadius >= player.pulseMaxRadius) {
                        player.pulseActive = false;
                    }
                }

                // --- クリスタルの更新・描画 ---
                crystals.forEach((c, index) => {
                    c.pulse += 0.05;
                    const r = c.radius + Math.sin(c.pulse) * 2;

                    ctx.save();
                    ctx.shadowBlur = 15;
                    ctx.shadowColor = '#00f2fe';
                    ctx.fillStyle = '#00f2fe';
                    ctx.beginPath();
                    ctx.arc(c.x, c.y, r, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();

                    // 取得判定
                    if (Math.hypot(c.x - player.x, c.y - player.y) < player.radius + c.radius) {
                        audio.playCollect();
                        createExplosion(c.x, c.y, '#00f2fe', 8);
                        score += 100;
                        document.getElementById('score-display').textContent = score;
                        crystals.splice(index, 1);
                    }
                });

                // --- 敵の更新・描画 ---
                enemies.forEach((enemy, index) => {
                    enemy.x += enemy.vx;
                    enemy.y += enemy.vy;

                    // 描画
                    ctx.save();
                    ctx.shadowBlur = 12;
                    ctx.shadowColor = '#ff0055';
                    ctx.fillStyle = '#ff0055';
                    ctx.beginPath();
                    ctx.arc(enemy.x, enemy.y, enemy.radius, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();

                    // プレイヤーとの衝突判定
                    if (Math.hypot(enemy.x - player.x, enemy.y - player.y) < player.radius + enemy.radius) {
                        audio.playHit();
                        createExplosion(enemy.x, enemy.y, '#ff0055', 15);
                        enemies.splice(index, 1);
                        
                        health -= 20;
                        document.getElementById('health-bar').style.width = Math.max(0, health) + '%';

                        if (health <= 0) {
                            gameState = 'gameover';
                            document.getElementById('hud').classList.add('hidden');
                            document.getElementById('final-score-display').textContent = score;
                            document.getElementById('game-over-screen').classList.remove('hidden');
                        }
                    }
                });

                // --- プレイヤーの描画 ---
                ctx.save();
                ctx.shadowBlur = 20;
                ctx.shadowColor = '#00f2fe';
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
                ctx.fill();

                ctx.strokeStyle = '#00f2fe';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(player.x, player.y, player.radius + 4, 0, Math.PI * 2);
                ctx.stroke();
                ctx.restore();
            }

            // --- 特殊エフェクト粒子の描画・更新 ---
            fxParticles.forEach((p, index) => {
                p.x += p.vx;
                p.y += p.vy;
                p.life -= p.decay;

                if (p.life <= 0) {
                    fxParticles.splice(index, 1);
                } else {
                    ctx.save();
                    ctx.globalAlpha = p.life;
                    ctx.fillStyle = p.color;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }
            });

            requestAnimationFrame(loop);
        }

        // アニメーションループ起動
        requestAnimationFrame(loop);
    </script>
</body>
</html>
